extends:
  - recommended
rules:
  # 本仓库不做外部发布，无需 contact/license
  info-contact: off
  info-license: off
  # Tag descriptions are emitted from the Console Swag annotations.
  tag-description: warn
  # BearerAuth is reserved for future use; Console currently has no auth middleware,
  # 当前所有接口匿名访问，故不要求每 operation 声明 security
  security-defined: off
  # The unified index documents non-HTTP contracts and intentionally has no servers.
  no-empty-servers: off
  # 每个字段必须有 description 与 example（Global Constraints）
  no-schema-type-mismatch: error
  # Read-only list/settings endpoints may legitimately expose only 5xx errors.
  operation-4xx-response: warn
  operation-operationId: error
  operation-summary: error
