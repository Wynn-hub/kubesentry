server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header X-Request-Id $request_id;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
