apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policydistributions.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: PolicyDistribution
    listKind: PolicyDistributionList
    plural: policydistributions
    singular: policydistribution
    shortNames: [pdist]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Groups
          type: string
          jsonPath: .spec.policyGroups
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [policyGroups]
              properties:
                clusters:
                  type: object
                  properties:
                    byName:
                      type: array
                      items: { type: string }
                    clusterSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                policyGroups:
                  type: array
                  items: { type: string }
                overrides:
                  type: array
                  items:
                    type: object
                    required: [cluster, enforcementMode]
                    properties:
                      cluster: { type: string }
                      enforcementMode:
                        type: string
                        enum: [enforce, audit]
            status:
              type: object
              properties:
                clusters:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      state: { type: string }
                      appliedVersion: { type: string }
                      message: { type: string }
                      lastSyncTime: { type: string, format: date-time }
