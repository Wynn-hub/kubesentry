# Same namespace as the member chart's own components (webhook/operator/
# console) so the gateway sits alongside them; kubesentry-system is one of
# the system namespaces exempted from policy enforcement by the
# 0004_seed_default_exception migration, so the gateway is exempt too.
namespace: kubesentry-system

gateway:
  # Set enabled=true to run two active/standby Gateway Pods. The elected
  # leader is the only Ready Service endpoint; standby takes over on failure.
  highAvailability:
    enabled: false
    replicas: 2
  replicas: 1
  image:
    repository: wynnhub/kubesentry-gateway
    tag: "v1.2.0"
    pullPolicy: IfNotPresent
  grpc:
    port: 9443
    # 对成员集群暴露方式：ClusterIP（同集群自注册）/ NodePort / LoadBalancer
    # NodePort/LoadBalancer use externalTrafficPolicy: Cluster so every node
    # can forward traffic to the single Ready Gateway leader.
    serviceType: NodePort
    nodePort: 30443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  # Authenticates non-cluster Gateway clients such as console-api. By default
  # the chart creates a random value and preserves it across upgrades. Set
  # existingSecret to use a Secret managed by an external secret system; it
  # must contain the configured key.
  sharedToken:
    existingSecret: ""
    key: token

# Console is a platform component (D1: 中台 = console + gateway), packaged
# here rather than in the member chart. Note this means single-cluster
# users need both charts installed (gateway for the UI, member for
# webhook/operator enforcement) — see `make deploy-local`/`undeploy-local`
# for the two-install pattern.
console:
  enabled: true
  replicas: 1
  # api container: the Go REST API only (no embedded frontend, Task 13).
  image:
    repository: wynnhub/kubesentry-console
    tag: "v1.2.0"
    pullPolicy: IfNotPresent
  # web container: nginx serving the built Vue SPA, proxying /api/* and
  # /healthz to the api container over localhost within the same pod.
  webImage:
    repository: wynnhub/kubesentry-console-web
    tag: "v1.2.0"
    pullPolicy: IfNotPresent
  # Runtime ports used by the nginx ConfigMap and both sidecar containers.
  # Override them through Helm values without rebuilding the web image.
  ports:
    web: 8080
    api: 8081
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  session:
    absoluteDuration: 24h
    idleDuration: 30m
    # Set true when the Console is exposed through HTTPS. Keep false for local HTTP port-forwarding.
    cookieSecure: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  webResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgres:
  enabled: true
  password: "kubesentry"
  storage: "10Gi"
  external:
    dsn: ""

db:
  image:
    repository: wynnhub/kubesentry-db
    tag: "v1.2.0"

tls:
  secretName: kubesentry-gateway-tls
  # Bring your own CA-issued certificate instead of the built-in
  # self-signed one. Leave all three empty (default) to let the gateway use
  # its baked-in 99-year default self-signed CA + server cert (see
  # internal/tlssetup.DefaultCertBundle — hardcoded in Go, not this chart;
  # persisted into `secretName` on first start). Provide all three
  # (PEM text, not base64 — Helm encodes it) to use your own cert instead;
  # it must cover the DNS name the gateway is actually reached at (default:
  # kubesentry-gateway.<namespace>.svc, override via TLS_DNS_NAME if exposed
  # differently, e.g. NodePort/LB).
  ca: ""    # PEM CA certificate
  cert: ""  # PEM server certificate
  key: ""   # PEM server private key
