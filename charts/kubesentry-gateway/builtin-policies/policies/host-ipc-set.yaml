apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: host-ipc-set
  labels:
    kubesentry.io/category: security
    kubesentry.io/source: builtin
spec:
  match:
    operations: [CREATE, UPDATE]
    resources:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  enforcementMode: enforce
  description: "Fails when hostIPC attribute is configured."
  rego: |
    package kubesentry

    deny[msg] {
      input.request.object.spec.hostIPC == true
      msg := "hostIPC must not be set"
    }
