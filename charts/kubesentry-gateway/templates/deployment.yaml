apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-gateway
  namespace: {{ .Values.namespace }}
  labels: { app: kubesentry-gateway }
spec:
  replicas: {{ ternary .Values.gateway.highAvailability.replicas .Values.gateway.replicas .Values.gateway.highAvailability.enabled }}
  selector:
    matchLabels: { app: kubesentry-gateway }
  template:
    metadata:
      labels: { app: kubesentry-gateway }
    spec:
      serviceAccountName: kubesentry-gateway
      initContainers:
        - name: wait-for-migration
          # bitnami/kubectl no longer publishes versioned tags (only
          # `latest`, which drifts) — alpine/k8s:1.31.0 is pinned and still
          # ships kubectl + a shell.
          image: "alpine/k8s:1.31.0"
          command: ["sh", "-c"]
          args:
            - |
              until kubectl wait --for=condition=complete job/kubesentry-db-migrate -n {{ .Values.namespace }} --timeout=5s; do sleep 2; done
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.grpc.port }}
              name: grpc
            - containerPort: 8081
              name: probe
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace }}
            - name: GRPC_ADDR
              value: ":{{ .Values.gateway.grpc.port }}"
            - name: TLS_SECRET_NAME
              value: {{ .Values.tls.secretName }}
            - name: TLS_DNS_NAME
              value: "kubesentry-gateway.{{ .Values.namespace }}.svc"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-postgres-credentials
                  key: dsn
            - name: GATEWAY_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.sharedToken.existingSecret | default "kubesentry-gateway-shared-token" }}
                  key: {{ .Values.gateway.sharedToken.key }}
          # Plain HTTP, not the grpc probe type: the gRPC listener is
          # TLS-only, and Kubernetes' native `grpc` probe always dials in
          # plaintext, so it can never complete a handshake against it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
