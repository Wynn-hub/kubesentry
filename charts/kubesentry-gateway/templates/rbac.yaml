apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentry-gateway
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentry-gateway
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    # Leader election needs to create and renew its Lease, but never delete it.
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # initContainer wait-for-migration polls this Job's status via `kubectl
  # wait` before the gateway container starts (spec D17). `delete` is for
  # the pre-delete cleanup hook (db-migrate-cleanup-job.yaml) — `helm
  # uninstall` does not remove hook resources on its own, so without this
  # the migrate Job (and its terminated Pod) is orphaned in the namespace
  # after every uninstall.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, delete]
    resourceNames: [kubesentry-db-migrate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentry-gateway
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesentry-gateway
subjects:
  - kind: ServiceAccount
    name: kubesentry-gateway
    namespace: {{ .Values.namespace }}
