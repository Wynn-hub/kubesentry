{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubesentry-postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: kubesentry-postgres
  replicas: 1
  selector:
    matchLabels:
      app: kubesentry-postgres
  template:
    metadata:
      labels:
        app: kubesentry-postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          env:
            - name: POSTGRES_DB
              value: kubesentry
            - name: POSTGRES_USER
              value: kubesentry
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | default "kubesentry" | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kubesentry"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage | default "10Gi" }}
{{- end }}
