{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-postgres-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  dsn: "postgres://kubesentry:{{ .Values.postgres.password | default "kubesentry" }}@kubesentry-postgres.{{ .Values.namespace }}.svc:5432/kubesentry?sslmode=disable"
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-postgres-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  dsn: {{ required "postgres.external.dsn is required when postgres.enabled=false" .Values.postgres.external.dsn | quote }}
{{- end }}
