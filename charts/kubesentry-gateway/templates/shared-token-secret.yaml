{{- $config := .Values.gateway.sharedToken -}}
{{- if not $config.existingSecret }}
{{- $secretName := "kubesentry-gateway-shared-token" -}}
{{- $token := "" -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName -}}
{{- if and $existing (hasKey $existing.data $config.key) }}
{{- $token = index $existing.data $config.key | b64dec -}}
{{- else }}
{{- $token = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{ $config.key }}: {{ $token | quote }}
{{- end }}
