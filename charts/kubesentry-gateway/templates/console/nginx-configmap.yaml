{{- if .Values.console.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesentry-console-nginx
  namespace: {{ .Values.namespace }}
  annotations:
    kubesentry.io/config-purpose: "console nginx runtime configuration"
data:
  default.conf: |
    server {
        listen {{ .Values.console.ports.web }};
        root /usr/share/nginx/html;
        index index.html;

        # The bundled Console OpenAPI document is served by the api container;
        # the documentation page itself remains a Vue history route below.
        location ^~ /api/docs/ {
            proxy_pass http://127.0.0.1:{{ .Values.console.ports.api }}/api/docs/;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:{{ .Values.console.ports.api }}/api/;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass http://127.0.0.1:{{ .Values.console.ports.api }}/healthz;
        }

        location = /system/api-docs {
            try_files /index.html =404;
        }

        location ^~ /system/api-docs/ {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
