{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-console
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app: kubesentry-console
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/console/nginx-configmap.yaml") . | sha256sum }}
      labels:
        app: kubesentry-console
    spec:
      serviceAccountName: kubesentry-console
      initContainers:
        - name: wait-for-gateway
          image: "busybox:1.36"
          command: ["sh", "-c"]
          args:
            - |
              until nc -z kubesentry-gateway.{{ .Values.namespace }}.svc {{ .Values.gateway.grpc.port }}; do sleep 2; done
      volumes:
        - name: gateway-ca
          secret:
            secretName: {{ .Values.tls.secretName }}
        - name: nginx-config
          configMap:
            name: kubesentry-console-nginx
            items:
              - key: default.conf
                path: default.conf
      containers:
        - name: web
          image: "{{ .Values.console.webImage.repository }}:{{ .Values.console.webImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.ports.web }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.console.webResources | nindent 12 }}
        - name: api
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.console.ports.api }}
          env:
            - name: CONSOLE_ADDR
              value: ":{{ .Values.console.ports.api }}"
            - name: GATEWAY_ADDRESS
              value: "kubesentry-gateway.{{ .Values.namespace }}.svc:{{ .Values.gateway.grpc.port }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONSOLE_WEB_URL
              value: "http://127.0.0.1:{{ .Values.console.ports.web }}/"
            - name: CONSOLE_SESSION_ABSOLUTE_DURATION
              value: {{ .Values.console.session.absoluteDuration | quote }}
            - name: CONSOLE_SESSION_IDLE_DURATION
              value: {{ .Values.console.session.idleDuration | quote }}
            - name: CONSOLE_SESSION_COOKIE_SECURE
              value: {{ .Values.console.session.cookieSecure | quote }}
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-postgres-credentials
                  key: dsn
            - name: GATEWAY_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.sharedToken.existingSecret | default "kubesentry-gateway-shared-token" }}
                  key: {{ .Values.gateway.sharedToken.key }}
          volumeMounts:
            - name: gateway-ca
              mountPath: /etc/kubesentry/gateway-ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
{{- end }}
