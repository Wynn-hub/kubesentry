{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-console
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app: kubesentry-console
  template:
    metadata:
      labels:
        app: kubesentry-console
    spec:
      serviceAccountName: kubesentry-console
      initContainers:
        - name: wait-for-gateway
          image: "busybox:1.36"
          command: ["sh", "-c"]
          args:
            - |
              until nc -z kubesentry-gateway.{{ .Values.namespace }}.svc {{ .Values.gateway.grpc.port }}; do sleep 2; done
      volumes:
        - name: gateway-ca
          secret:
            secretName: {{ .Values.tls.secretName }}
      containers:
        - name: web
          image: "{{ .Values.console.webImage.repository }}:{{ .Values.console.webImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.webImage.pullPolicy }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.console.webResources | nindent 12 }}
        - name: api
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: CONSOLE_ADDR
              value: ":8081"
            - name: GATEWAY_ADDRESS
              value: "kubesentry-gateway.{{ .Values.namespace }}.svc:{{ .Values.gateway.grpc.port }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-postgres-credentials
                  key: dsn
          volumeMounts:
            - name: gateway-ca
              mountPath: /etc/kubesentry/gateway-ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
{{- end }}
