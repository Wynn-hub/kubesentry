apiVersion: batch/v1
kind: Job
metadata:
  name: kubesentry-db-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          # The "wait for postgres" retry loop lives inside cmd/db/main.go
          # (spec D17: post-install fires once regular resources are
          # submitted, not necessarily Ready).
          args: ["migrate"]
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-postgres-credentials
                  key: dsn
