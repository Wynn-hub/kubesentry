apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    singular: policy
    shortNames: [pol]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [match, enforcementMode, rego]
              properties:
                match:
                  type: object
                  required: [operations, resources]
                  properties:
                    operations:
                      type: array
                      items:
                        type: string
                        enum: [CREATE, UPDATE, DELETE, CONNECT]
                    resources:
                      type: array
                      items:
                        type: object
                        required: [apiGroups, apiVersions, resources]
                        properties:
                          apiGroups:
                            type: array
                            items: {type: string}
                          apiVersions:
                            type: array
                            items: {type: string}
                          resources:
                            type: array
                            items: {type: string}
                    namespaceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                enforcementMode:
                  type: string
                  enum: [enforce, audit]
                rego:
                  type: string
                description:
                  type: string
                rollbackTo:
                  type: object
                  properties:
                    version:
                      type: integer
                      format: int64
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Version
          type: integer
          jsonPath: .status.currentVersion
        - name: Mode
          type: string
          jsonPath: .spec.enforcementMode
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
