apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policygroups.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: PolicyGroup
    listKind: PolicyGroupList
    plural: policygroups
    singular: policygroup
    shortNames: [pg]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [enabled]
              properties:
                displayName:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                policies:
                  type: array
                  items:
                    type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                      enabled:
                        type: boolean
                      mode:
                        type: string
                        enum: [enforce, audit]
                      rego:
                        type: string
                      match:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Active
          type: integer
          jsonPath: .status.activePolicies
        - name: Skipped
          type: integer
          jsonPath: .status.skippedPolicies
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
