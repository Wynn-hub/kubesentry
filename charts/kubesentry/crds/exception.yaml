apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policyexceptions.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: PolicyException
    listKind: PolicyExceptionList
    plural: policyexceptions
    singular: policyexception
    shortNames: [pex]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: |
                ((has(self.spec.policyRefs) && size(self.spec.policyRefs) > 0) ? 1 : 0) +
                ((has(self.spec.policyGroupRefs) && size(self.spec.policyGroupRefs) > 0) ? 1 : 0) +
                ((has(self.spec.allPolicies) && self.spec.allPolicies) ? 1 : 0) == 1
              message: "Exactly one of spec.policyRefs / spec.policyGroupRefs / spec.allPolicies must be set."
          required: [spec]
          properties:
            spec:
              type: object
              required: [match, duration, reason]
              properties:
                policyRefs:
                  type: array
                  items: {type: string, minLength: 1}
                policyGroupRefs:
                  type: array
                  items: {type: string, minLength: 1}
                allPolicies:
                  type: boolean
                match:
                  type: object
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    namespaceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    resourceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                duration:
                  type: string
                  minLength: 2
                retainAfterExpiry:
                  type: string
                reason:
                  type: string
                  minLength: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: ExpiresAt
          type: date
          jsonPath: .status.expiresAt
        - name: Reason
          type: string
          jsonPath: .spec.reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
