apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: readiness-probe-missing
  labels:
    kubesentry.io/category: reliability
    kubesentry.io/source: builtin
spec:
  match:
    operations: [CREATE, UPDATE]
    resources:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  enforcementMode: audit
  description: "Fails when a readiness probe is not configured."
  rego: |
    package kubesentry

    deny[msg] {
      c := input.request.object.spec.containers[_]
      not c.readinessProbe
      msg := sprintf("container %q must define a readinessProbe", [c.name])
    }
