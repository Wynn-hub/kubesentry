apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: sensitive-configmap-content
  labels:
    kubesentry.io/category: security
    kubesentry.io/source: builtin
spec:
  match:
    operations: [CREATE, UPDATE]
    resources:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [configmaps]
  enforcementMode: enforce
  description: "Fails when potentially sensitive content is detected in ConfigMap keys or values."
  rego: |
    package kubesentry

    _sensitive_keys := {
      "password", "passwd", "secret", "token", "api_key", "apikey",
      "private_key", "access_key", "credentials", "credential",
    }

    deny[msg] {
      key := input.request.object.data[k]
      k_lower := lower(k)
      pattern := _sensitive_keys[_]
      contains(k_lower, pattern)
      msg := sprintf("ConfigMap key %q may contain sensitive data", [k])
    }
