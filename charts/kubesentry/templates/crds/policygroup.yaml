apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policygroups.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: PolicyGroup
    listKind: PolicyGroupList
    plural: policygroups
    singular: policygroup
    shortNames: [pg]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [enabled, policies]
              properties:
                displayName:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                namespaceSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                policies:
                  type: object
                  properties:
                    byName:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          enforcementMode:
                            type: string
                            enum: [enforce, audit]
                    bySelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                selectorEnforcementMode:
                  type: string
                  enum: [enforce, audit]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Policies
          type: integer
          jsonPath: .status.resolvedCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
