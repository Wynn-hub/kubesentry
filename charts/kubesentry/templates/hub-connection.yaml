apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-hub-ca
  namespace: {{ .Values.namespace }}
data:
  ca.crt: {{ required "gateway.caBundle is required — standalone deployment is no longer supported" .Values.gateway.caBundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-hub-register
  namespace: {{ .Values.namespace }}
stringData:
  token: {{ required "gateway.registrationToken is required" .Values.gateway.registrationToken | quote }}
