apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry-operator
rules:
  - apiGroups: [kubesentry.io]
    resources: [policies, policies/status, policyversions, policygroups, policygroups/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubesentry.io]
    resources: [policyexceptions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubesentry.io]
    resources: [policyexceptions/status]
    verbs: [get, update, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [kubesentry]
    verbs: [get, patch, delete]
  # controller-runtime's informer first lists the collection and then watches
  # it; resourceNames cannot scope either verb. Keep this grant read-only and
  # retain the named rule above for all mutations.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [kubesentry-policyexception-immutability, kubesentry-policyexception-immutability-binding]
    verbs: [delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [policies.kubesentry.io, policygroups.kubesentry.io, policyexceptions.kubesentry.io, policyversions.kubesentry.io]
    verbs: [delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    resourceNames: [kubesentry-webhook, kubesentry-operator, kubesentry-tls-setup]
    verbs: [delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.tls.secretName }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubesentry-hub-register]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubesentry-hub-auth, kubesentry-hub-register, kubesentry-hub-ca, kubesentry-webhook-tls]
    verbs: [get, update, delete]
  # create cannot be scoped by resourceNames (Kubernetes RBAC has no
  # resource name to check against a POST to the collection endpoint);
  # namespace scoping via this Role is the tightest grant available.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: ["", "apps", "batch", "rbac.authorization.k8s.io"]
    resources: [services, serviceaccounts, deployments, jobs, roles, rolebindings]
    resourceNames: [kubesentry-webhook, kubesentry-operator, kubesentry-tls-setup]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesentry-operator
subjects:
  - kind: ServiceAccount
    name: kubesentry-operator
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesentry-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesentry-operator
subjects:
  - kind: ServiceAccount
    name: kubesentry-operator
    namespace: {{ .Values.namespace }}
