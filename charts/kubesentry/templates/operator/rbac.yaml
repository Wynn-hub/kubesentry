apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry-operator
rules:
  - apiGroups: [kubesentry.io]
    resources: [policies, policies/status, policyversions, policygroups, policygroups/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubesentry.io]
    resources: [policyexceptions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kubesentry.io]
    resources: [policyexceptions/status]
    verbs: [get, update, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.tls.secretName }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubesentry-hub-register]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubesentry-hub-auth]
    verbs: [get, update]
  # create cannot be scoped by resourceNames (Kubernetes RBAC has no
  # resource name to check against a POST to the collection endpoint);
  # namespace scoping via this Role is the tightest grant available.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesentry-operator
subjects:
  - kind: ServiceAccount
    name: kubesentry-operator
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesentry-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesentry-operator
subjects:
  - kind: ServiceAccount
    name: kubesentry-operator
    namespace: {{ .Values.namespace }}
