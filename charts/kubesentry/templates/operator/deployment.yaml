apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: kubesentry-operator
  template:
    metadata:
      labels:
        app: kubesentry-operator
    spec:
      serviceAccountName: kubesentry-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: VWC_NAME
              value: kubesentry
            # —— hub connection（hub.address 为空时以下 env 渲染为空串，operator 跳过）——
            - name: HUB_ADDRESS
              value: {{ .Values.hub.address | quote }}
            - name: HUB_TLS_SERVER_NAME
              value: {{ .Values.hub.tlsServerName | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.hub.clusterName | quote }}
            - name: OPERATOR_VERSION
              value: {{ .Chart.AppVersion | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- if .Values.hub.address }}
          volumeMounts:
            - name: hub-ca
              mountPath: /etc/kubesentry/hub-ca
              readOnly: true
{{- end }}
      {{- if .Values.hub.address }}
      volumes:
        - name: hub-ca
          secret:
            secretName: kubesentry-hub-ca
      {{- end }}
