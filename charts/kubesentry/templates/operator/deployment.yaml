apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-operator
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ ternary .Values.operator.highAvailability.replicas .Values.operator.replicas .Values.operator.highAvailability.enabled }}
  selector:
    matchLabels:
      app: kubesentry-operator
  template:
    metadata:
      labels:
        app: kubesentry-operator
    spec:
      serviceAccountName: kubesentry-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: VWC_NAME
              value: kubesentry
            - name: SECRET_NAME
              value: {{ .Values.tls.secretName | quote }}
            # —— gateway connection (required — standalone deployment removed) ——
            - name: GATEWAY_ADDRESS
              value: {{ required "gateway.address is required — standalone deployment is no longer supported" .Values.gateway.address | quote }}
            - name: GATEWAY_TLS_SERVER_NAME
              value: {{ .Values.gateway.tlsServerName | quote }}
            - name: CLUSTER_NAME
              value: {{ required "gateway.clusterName is required" .Values.gateway.clusterName | quote }}
            - name: OPERATOR_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.admissionEvents.enabled }}
            - name: ADMISSION_EVENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-admission-events
                  key: token
            {{- end }}
          ports:
            {{- if .Values.admissionEvents.enabled }}
            - name: admission-events
              containerPort: {{ .Values.admissionEvents.servicePort }}
            {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: hub-ca
              mountPath: /etc/kubesentry/hub-ca
              readOnly: true
      volumes:
        # optional: true — kubesentry-hub-ca only exists when gateway.caBundle
        # is set (see hub-connection.yaml). Without it, the operator falls
        # back in code to internal/tlssetup.DefaultCertBundle's baked-in CA.
        - name: hub-ca
          secret:
            secretName: kubesentry-hub-ca
            optional: true
