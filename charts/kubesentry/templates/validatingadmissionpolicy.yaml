apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubesentry-policyexception-immutability
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["kubesentry.io"]
        apiVersions: ["v1alpha1"]
        resources:   ["policyexceptions"]
        operations:  ["UPDATE"]
  validations:
    - expression: |
        oldObject.spec.policyRefs == object.spec.policyRefs
      message: "spec.policyRefs is immutable"
    - expression: |
        oldObject.spec.policyGroupRefs == object.spec.policyGroupRefs
      message: "spec.policyGroupRefs is immutable"
    - expression: |
        oldObject.spec.allPolicies == object.spec.allPolicies
      message: "spec.allPolicies is immutable"
    - expression: |
        oldObject.spec.match == object.spec.match
      message: "spec.match is immutable"
    - expression: |
        !(has(oldObject.status) && has(oldObject.status.phase) && oldObject.status.phase == "Expired") ||
        oldObject.spec == object.spec
      message: "PolicyException is Expired; spec is frozen"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubesentry-policyexception-immutability-binding
spec:
  policyName: kubesentry-policyexception-immutability
  validationActions: [Deny]
