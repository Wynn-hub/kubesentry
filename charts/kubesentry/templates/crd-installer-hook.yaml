{{- $supportAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" "helm.sh/hook-weight" "-10" -}}
{{- $jobAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" "helm.sh/hook-weight" "-5" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentry-crd-installer
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml $supportAnnotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry-crd-installer
  annotations:
    {{- toYaml $supportAnnotations | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [policies.kubesentry.io, policygroups.kubesentry.io, policyexceptions.kubesentry.io, policyversions.kubesentry.io]
    verbs: [get, update, patch]
  # Kubernetes cannot scope create requests by resourceNames because the
  # object name is not available to RBAC until after the request is accepted.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesentry-crd-installer
  annotations:
    {{- toYaml $supportAnnotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesentry-crd-installer
subjects:
  - kind: ServiceAccount
    name: kubesentry-crd-installer
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesentry-crd-installer
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml $supportAnnotations | nindent 4 }}
data:
  exception.yaml: |-
{{ .Files.Get "crds/exception.yaml" | indent 4 }}
  policy.yaml: |-
{{ .Files.Get "crds/policy.yaml" | indent 4 }}
  policygroup.yaml: |-
{{ .Files.Get "crds/policygroup.yaml" | indent 4 }}
  policyversion.yaml: |-
{{ .Files.Get "crds/policyversion.yaml" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubesentry-crd-installer
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml $jobAnnotations | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kubesentry-crd-installer
      containers:
        - name: install-crds
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command: ["/operator", "apply-crds"]
          env:
            - name: CRD_MANIFEST_DIR
              value: /crds
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: crds
          configMap:
            name: kubesentry-crd-installer
