namespace: kubesentry-system

webhook:
  # Keep legacy replicas when disabled. Enabling HA explicitly deploys two
  # webhook replicas, which can be selected from the console install flow.
  highAvailability:
    enabled: false
    replicas: 2
  replicas: 2
  image:
    repository: wynnhub/kubesentry-webhook
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

operator:
  # The operator uses leader election; two replicas provide active/standby
  # failover while only the elected leader reconciles and links to Gateway.
  highAvailability:
    enabled: false
    replicas: 2
  replicas: 1
  image:
    repository: wynnhub/kubesentry-operator
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

tls:
  secretName: kubesentry-tls

policy:
  versionHistoryLimit: 20

failurePolicy: Fail

# Webhook-level namespace exclusion (forwarded to ValidatingWebhookConfiguration).
webhookNamespaceSelector:
  matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kubesentry-system

# Gateway connection — required. Standalone deployment (no gateway) is no
# longer supported; every field below must be set at install time.
gateway:
  address: ""                  # e.g. "kubesentry-gateway.kubesentry-system.svc:9443"
  # base64 PEM of the gateway CA — only needed to override. When left empty,
  # the operator trusts internal/tlssetup.DefaultCertBundle's baked-in CA at
  # the code level (no Secret/file involved) — the same fixed cert the
  # gateway itself falls back to when its own tls.ca/cert/key chart values
  # are unset. Set this only when the gateway runs in a different namespace
  # or was given its own tls.ca/cert/key (charts/kubesentry-gateway/values.yaml).
  caBundle: ""
  tlsServerName: ""            # override when address is an IP/NodePort; defaults to cert DNS
  clusterName: ""              # Cluster CR name registered on the gateway
  registrationToken: ""        # one-time token shown at cluster registration

admissionEvents:
  enabled: true
  servicePort: 8082
