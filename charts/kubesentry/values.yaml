namespace: kubesentry-system

webhook:
  replicas: 2
  image:
    repository: wynnhub/kubesentry-webhook
    tag: "v1.1.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

operator:
  replicas: 1
  image:
    repository: wynnhub/kubesentry-operator
    tag: "v1.1.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

console:
  enabled: true
  replicas: 1
  image:
    repository: wynnhub/kubesentry-console
    tag: "v1.1.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

tls:
  secretName: kubesentry-tls

policy:
  versionHistoryLimit: 20

failurePolicy: Fail

# Common namespaceSelector applied to all built-in PolicyGroups by default.
# Override per-group via builtinGroups.<name>.namespaceSelector.
builtinNamespaceSelector:
  matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kubesentry-system

# Per-group toggle and optional overrides.
builtinGroups:
  security:
    enabled: true
    # namespaceSelector: null      # set to override builtinNamespaceSelector
    # selectorEnforcementMode: ""  # affects bySelector-matched future user policies only
  efficiency:
    enabled: true
  reliability:
    enabled: true

# Per-policy toggles and per-entry mode overrides.
# Keys are the Policy.metadata.name (kebab-case) of each built-in policy.
# Omitted keys default to enabled=true with the mode declared in the policy yaml.
builtinPolicies: {}
#   run-as-privileged:
#     enabled: true   # set false to drop this Policy + remove from group.byName
#     mode: ""        # "enforce" | "audit" — overrides the policy's default

# Webhook-level namespace exclusion (forwarded to ValidatingWebhookConfiguration).
# Kept separate from builtinNamespaceSelector: this filters which requests reach
# the webhook server; the group selector filters which groups evaluate them.
webhookNamespaceSelector:
  matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kubesentry-system
