namespace: kubesentry-system

webhook:
  replicas: 2
  image:
    repository: wynnhub/kubesentry-webhook
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

operator:
  replicas: 1
  image:
    repository: wynnhub/kubesentry-operator
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

tls:
  secretName: kubesentry-tls

policy:
  versionHistoryLimit: 20

failurePolicy: Fail

# Webhook-level namespace exclusion (forwarded to ValidatingWebhookConfiguration).
webhookNamespaceSelector:
  matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kubesentry-system

# Gateway connection — required. Standalone deployment (no gateway) is no
# longer supported; every field below must be set at install time.
gateway:
  address: ""                  # e.g. "kubesentry-gateway.kubesentry-system.svc:9443"
  caBundle: ""                 # base64 PEM of the gateway CA (ca.crt from the gateway TLS secret)
  tlsServerName: ""            # override when address is an IP/NodePort; defaults to cert DNS
  clusterName: ""              # Cluster CR name registered on the gateway
  registrationToken: ""        # one-time token shown at cluster registration
