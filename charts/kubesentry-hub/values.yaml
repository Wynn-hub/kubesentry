# Same namespace as the member chart's own components (webhook/operator/
# console) so the hub sits alongside them and inherits the same built-in
# policy namespace exclusion — no separate exclusion entry needed.
namespace: kubesentry-system

hub:
  replicas: 1
  image:
    repository: wynnhub/kubesentry-hub
    tag: "latest"
    pullPolicy: IfNotPresent
  grpc:
    port: 9443
    # 对成员集群暴露方式：ClusterIP（同集群自注册）/ NodePort / LoadBalancer
    serviceType: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

tls:
  secretName: kubesentry-hub-tls
