# Same namespace as the member chart's own components (webhook/operator/
# console) so the hub sits alongside them and inherits the same built-in
# policy namespace exclusion — no separate exclusion entry needed.
namespace: kubesentry-system

hub:
  replicas: 1
  image:
    repository: wynnhub/kubesentry-hub
    tag: "latest"
    pullPolicy: IfNotPresent
  grpc:
    port: 9443
    # 对成员集群暴露方式：ClusterIP（同集群自注册）/ NodePort / LoadBalancer
    serviceType: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Console is a platform component (D1: 中台 = console + hub), packaged
# here rather than in the member chart. Note this means single-cluster
# users need both charts installed (hub for the UI, member for
# webhook/operator enforcement) — see `make deploy-local`/`undeploy-local`
# for the two-install pattern.
console:
  enabled: true
  replicas: 1
  image:
    repository: wynnhub/kubesentry-console
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

tls:
  secretName: kubesentry-hub-tls
  # Bring your own CA-issued certificate instead of the built-in
  # self-signed one. Leave all three empty (default) to let the hub
  # auto-generate and persist a self-signed CA + server cert into
  # `secretName` on first start (see internal/tlssetup.GenerateCerts).
  # Provide all three (PEM text, not base64 — Helm encodes it) to use
  # your own cert instead; it must cover the DNS name the hub is
  # actually reached at (default: kubesentry-hub.<namespace>.svc,
  # override via TLS_DNS_NAME if exposed differently, e.g. NodePort/LB).
  ca: ""    # PEM CA certificate
  cert: ""  # PEM server certificate
  key: ""   # PEM server private key
