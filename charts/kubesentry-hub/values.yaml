# Same namespace as the member chart's own components (webhook/operator/
# console) so the hub sits alongside them; kubesentry-system is one of the
# systemNamespaces below, so the hub is exempt from policy enforcement too.
namespace: kubesentry-system

hub:
  replicas: 1
  image:
    repository: wynnhub/kubesentry-hub
    tag: "latest"
    pullPolicy: IfNotPresent
  grpc:
    port: 9443
    # 对成员集群暴露方式：ClusterIP（同集群自注册）/ NodePort / LoadBalancer
    serviceType: NodePort
    nodePort: 30443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Console is a platform component (D1: 中台 = console + hub), packaged
# here rather than in the member chart. Note this means single-cluster
# users need both charts installed (hub for the UI, member for
# webhook/operator enforcement) — see `make deploy-local`/`undeploy-local`
# for the two-install pattern.
console:
  enabled: true
  replicas: 1
  image:
    repository: wynnhub/kubesentry-console
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

tls:
  secretName: kubesentry-hub-tls
  # Bring your own CA-issued certificate instead of the built-in
  # self-signed one. Leave all three empty (default) to let the hub use
  # its baked-in 99-year default self-signed CA + server cert (see
  # internal/tlssetup.DefaultCertBundle — hardcoded in Go, not this chart;
  # persisted into `secretName` on first start). Provide all three
  # (PEM text, not base64 — Helm encodes it) to use your own cert instead;
  # it must cover the DNS name the hub is actually reached at (default:
  # kubesentry-hub.<namespace>.svc, override via TLS_DNS_NAME if exposed
  # differently, e.g. NodePort/LB).
  ca: ""    # PEM CA certificate
  cert: ""  # PEM server certificate
  key: ""   # PEM server private key

# System namespaces that are always exempted from every policy on every
# cluster, via a permanent default PolicyException (see
# templates/default-exception.yaml) — independent of which policy group or
# distribution is in effect.
systemNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - kubesentry-system

# Built-in default policy (Efficiency+Reliability+Security merged into one
# PolicyGroup named "default"). Applied to every registered cluster via a
# PolicyDistribution with clusterSelector: {} (matches all clusters).
builtinGroups:
  default:
    enabled: true

# Per-policy toggles and per-entry mode overrides.
# Keys are the Policy.metadata.name (kebab-case) of each built-in policy.
# Omitted keys default to enabled=true with the mode declared in the policy yaml.
builtinPolicies: {}
#   run-as-privileged:
#     enabled: true   # set false to drop this Policy + remove from group.byName
#     mode: ""        # "enforce" | "audit" — overrides the policy's default
