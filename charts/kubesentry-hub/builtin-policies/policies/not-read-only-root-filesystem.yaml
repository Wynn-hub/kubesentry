apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: not-read-only-root-filesystem
  labels:
    kubesentry.io/category: security
    kubesentry.io/source: builtin
spec:
  match:
    operations: [CREATE, UPDATE]
    resources:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  enforcementMode: audit
  description: "Fails when securityContext.readOnlyRootFilesystem is not true."
  rego: |
    package kubesentry

    deny[msg] {
      c := input.request.object.spec.containers[_]
      not c.securityContext.readOnlyRootFilesystem == true
      msg := sprintf("container %q should set securityContext.readOnlyRootFilesystem=true", [c.name])
    }
