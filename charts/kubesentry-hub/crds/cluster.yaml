apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.kubesentry.io
spec:
  group: kubesentry.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames: [mcl]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Heartbeat
          type: date
          jsonPath: .status.lastHeartbeat
        - name: Version
          type: string
          jsonPath: .status.operatorVersion
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                clusterUID:
                  type: string
                lastHeartbeat:
                  type: string
                  format: date-time
                operatorVersion:
                  type: string
