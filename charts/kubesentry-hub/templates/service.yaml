apiVersion: v1
kind: Service
metadata:
  name: kubesentry-hub
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.hub.grpc.serviceType }}
  selector: { app: kubesentry-hub }
  ports:
    - name: grpc
      port: {{ .Values.hub.grpc.port }}
      targetPort: grpc
      {{- if and (eq .Values.hub.grpc.serviceType "NodePort") .Values.hub.grpc.nodePort }}
      nodePort: {{ .Values.hub.grpc.nodePort }}
      {{- end }}
