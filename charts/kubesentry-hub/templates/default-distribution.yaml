{{- $u := index .Values.builtinGroups "default" | default dict }}
{{- if $u.enabled }}
apiVersion: kubesentry.io/v1alpha1
kind: PolicyDistribution
metadata:
  name: default
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  clusters:
    clusterSelector: {}
  policyGroups:
    - default
{{- end }}
