{{- /*
Render the merged "default" PolicyGroup from
builtin-policies/groups/default.yaml; honor
values.builtinGroups.default.enabled / namespaceSelector / selectorEnforcementMode.
*/ -}}
{{- $g := $.Files.Get "builtin-policies/groups/default.yaml" | fromYaml }}
{{- $name := $g.metadata.name }}
{{- $u := index $.Values.builtinGroups $name | default dict }}
{{- if $u.enabled }}
apiVersion: kubesentry.io/v1alpha1
kind: PolicyGroup
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" $.Chart.Name $.Chart.Version }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion }}
    kubesentry.io/source: builtin
spec:
  displayName: {{ $g.spec.displayName | quote }}
  description: {{ $g.spec.description | quote }}
  enabled: true
  namespaceSelector:
{{ default $.Values.builtinNamespaceSelector $u.namespaceSelector | toYaml | indent 4 }}
  policies:
    byName:
    {{- range $member := $g.spec.members }}
    {{- $po := index $.Values.builtinPolicies $member | default dict }}
    {{- $polEnabled := hasKey $po "enabled" | ternary $po.enabled true }}
    {{- if $polEnabled }}
    {{- $srcPol := $.Files.Get (printf "builtin-policies/policies/%s.yaml" $member) | fromYaml }}
      - name: {{ $member }}
        enforcementMode: {{ (and (hasKey $po "mode") (ne (default "" $po.mode) "")) | ternary $po.mode $srcPol.spec.enforcementMode }}
    {{- end }}
    {{- end }}
  {{- if $u.selectorEnforcementMode }}
  selectorEnforcementMode: {{ $u.selectorEnforcementMode }}
  {{- end }}
{{- end }}
