{{- if .Values.systemNamespaces }}
apiVersion: kubesentry.io/v1alpha1
kind: PolicyException
metadata:
  name: default-system-namespaces
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  allPolicies: true
  match:
    namespaces:
{{ .Values.systemNamespaces | toYaml | indent 6 }}
  # ponytail: time.Duration has no "forever" — ~100y is below its ~292y
  # ceiling and outlives any real deployment; bump if that ever matters.
  duration: "876000h"
  reason: "System namespaces are excluded from policy enforcement by default"
{{- end }}
