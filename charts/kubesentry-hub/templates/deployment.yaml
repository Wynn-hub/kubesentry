apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-hub
  namespace: {{ .Values.namespace }}
  labels: { app: kubesentry-hub }
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels: { app: kubesentry-hub }
  template:
    metadata:
      labels: { app: kubesentry-hub }
    spec:
      serviceAccountName: kubesentry-hub
      containers:
        - name: hub
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.hub.grpc.port }}
              name: grpc
            - containerPort: 8081
              name: probe
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace }}
            - name: GRPC_ADDR
              value: ":{{ .Values.hub.grpc.port }}"
            - name: TLS_SECRET_NAME
              value: {{ .Values.tls.secretName }}
            - name: TLS_DNS_NAME
              value: "kubesentry-hub.{{ .Values.namespace }}.svc"
          # Plain HTTP, not the grpc probe type: the gRPC listener is
          # TLS-only, and Kubernetes' native `grpc` probe always dials in
          # plaintext, so it can never complete a handshake against it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
{{ toYaml .Values.hub.resources | indent 12 }}
