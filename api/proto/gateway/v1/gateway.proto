syntax = "proto3";

package kubesentry.gateway.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Wynn-hub/kubesentry/internal/gatewaypb";

// Hub is the control-plane service member clusters dial into.
// Naming note: "Member" (not "Agent") — there is no standalone agent
// component; the member-side client lives inside the operator binary.
service Hub {
  // Register consumes a one-time registration token and returns the
  // cluster-scoped long-lived token used to authenticate Sync.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Sync is the long-lived bidirectional stream: member sends heartbeats
  // and status reports, hub replies with acks and desired-state snapshots.
  rpc Sync(stream MemberMessage) returns (stream HubMessage);
  // Connect is the registration stream for non-cluster components (e.g.
  // console-api) that want to receive/forward Envelope traffic. Auth is a
  // shared static token carried in the first frame's ConnectRequest payload.
  rpc Connect(stream Envelope) returns (stream Envelope);
  // NotifyChange fires the gateway's change notifier, waking every Sync
  // session's pushLoop to re-render and (if changed) push a fresh snapshot.
  rpc NotifyChange(NotifyChangeRequest) returns (NotifyChangeResponse);
  // Dispatch is a dumb relay: forwards payload to the live Sync session
  // named by `to`, no destination resolution, no offline queueing.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
}

message RegisterRequest {
  string cluster_name = 1;       // Cluster CR name on the hub cluster
  string registration_token = 2; // one-time token issued at Cluster creation
  string cluster_uid = 3;        // kube-system namespace UID of the member
  string operator_version = 4;
}

message RegisterResponse {
  string cluster_token = 1; // long-lived; hub stores only its SHA-256
}

message MemberMessage {
  oneof msg {
    Heartbeat heartbeat = 1;
    StatusReport status_report = 2;
    Envelope envelope = 3; // reply path for Dispatch's request/reply correlation
    UninstallTaskReport uninstall_task_report = 4;
    AdmissionEventBatch admission_event_batch = 5;
  }
}

message Heartbeat {
  string operator_version = 1;
}

// StatusReport carries member policy counts and the last apply outcome.
message StatusReport {
  int32 ready_policies = 1;
  int32 invalid_policies = 2;
  string applied_version = 3; // hash of the last applied DesiredState
  string apply_error = 4;     // non-empty = last apply failed, why
}

message HubMessage {
  oneof msg {
    Ack ack = 1;
    DesiredState desired_state = 2;
    Envelope envelope = 3; // carries Dispatch traffic over the existing Sync stream
    AdmissionEventBatchAck admission_event_batch_ack = 4;
  }
}

// DesiredState is the full managed-object snapshot for one member cluster.
// An empty objects list means "no managed objects should exist" — deletion
// of a distribution cascades through here.
message DesiredState {
  string version_hash = 1;
  repeated ManagedObject objects = 2;
  string trace_id = 3; // spec D18 correlation id; set only on a NotifyChange-triggered push, empty on ticker resync
  repeated UninstallTask uninstall_tasks = 4;
  AdmissionEventConfig admission_event_config = 5;
}

message AdmissionEventConfig {
  string version = 1;
  int32 default_retention_days = 2;
  repeated AdmissionStoragePolicy storage_policies = 3;
  bool retry_enabled = 4;
  int32 max_retry_attempts = 5;
  int32 queue_capacity = 6;
}

// AdmissionStoragePolicy carries conditions only. Matching any rule stores the
// event, an empty rule set stores everything, and the retention period is the
// single default_retention_days above. priority only fixes the display order.
message AdmissionStoragePolicy {
  // 6 and 7 were action / retention_days before storage rules became
  // conditions-only; never reuse them.
  reserved 6, 7;
  int32 priority = 1;
  repeated string verdicts = 2;
  repeated string clusters = 3;
  repeated string gvks = 4;
  repeated string namespaces = 5;
  string match_mode = 8;
}

message AdmissionEvent {
  string event_id = 1;
  string cluster_uid = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string verdict = 4;
  string api_group = 5;
  string api_version = 6;
  string resource = 7;
  string operation = 8;
  string namespace = 9;
  string resource_name = 10;
  string username = 11;
  repeated string user_groups = 12;
  repeated string policy_names = 13;
  repeated string policy_group_names = 14;
  repeated string violations = 15;
  bytes metadata_snapshot = 16;
  bytes spec_snapshot = 17;
  string storage_policy_version = 18;
  string request_uid = 19;
  int32 delivery_attempt = 20;
}

message AdmissionEventBatch {
  repeated AdmissionEvent events = 1;
}

message AdmissionEventBatchAck {
  message Result {
    string event_id = 1;
    enum Status {
      STATUS_UNSPECIFIED = 0;
      ACCEPTED = 1;
      DISCARDED = 2;
      RETRYABLE = 3;
    }
    Status status = 2;
    string reason = 3;
    int32 delivery_attempt = 4;
  }
  repeated Result results = 1;
}

// UninstallTask is a durable, target-cluster-only command. The gateway keeps
// sending it until the member reports a terminal state, so reconnects cannot
// silently drop an administrator-approved teardown request.
message UninstallTask {
  int64 task_id = 1;
  int32 attempt = 2;
}

message UninstallTaskReport {
  int64 task_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    RECEIVED = 1;
    SUCCEEDED = 2;
    FAILED = 3;
  }
  State state = 2;
  string error = 3;
}

message ManagedObject {
  string kind = 1; // "Policy" | "PolicyGroup"
  string name = 2;
  map<string, string> labels = 3;
  bytes spec_json = 4; // JSON of the CR spec (v1alpha1 types both sides)
}

message Ack {}

// Envelope is the generic point-to-point frame used by Connect and by
// Dispatch's ride-along traffic over the existing Sync stream.
message Envelope {
  string from = 1;
  string to = 2;
  string correlation_id = 3;
  bytes payload = 4;
}

// ConnectRequest is the first frame's payload on a Connect stream (marshaled
// into Envelope.payload) — non-cluster components authenticate with a shared
// static token rather than the cluster Register/rotate flow.
message ConnectRequest {
  string component_id = 1; // e.g. "console-api"
  string shared_token = 2;
}

message NotifyChangeRequest {
  string topic = 1;
  string trace_id = 3; // spec D18 correlation id; console-api sets this, gateway just logs it for now
}

message NotifyChangeResponse {}

message DispatchRequest {
  string to = 1;
  string topic = 2;
  bytes payload = 3;
}

message DispatchResponse {
  bytes payload = 1;
}
