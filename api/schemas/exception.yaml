components:
  schemas:
    ExceptionMatch:
      type: object
      properties:
        namespaces:
          type: array
          items: {type: string, description: 命名空间名称, example: production}
          description: 精确匹配的命名空间
          example: [production]
        namespaceSelector:
          $ref: '#/components/schemas/LabelSelector'
        resourceSelector:
          $ref: '#/components/schemas/LabelSelector'
    LabelSelector:
      type: object
      properties:
        matchLabels:
          type: object
          additionalProperties: {type: string}
          description: 标签键值匹配
          example: {environment: production}
        matchExpressions:
          type: array
          description: 标签表达式
          items:
            type: object
            required: [key, operator]
            properties:
              key: {type: string, description: 标签键, example: environment}
              operator: {type: string, description: 匹配操作符, enum: [In, NotIn, Exists, DoesNotExist], example: In}
              values: {type: array, items: {type: string, description: 标签值, example: production}, description: 候选值, example: [production]}
          example: []
    ExceptionSpec:
      type: object
      required: [match, duration, reason]
      properties:
        policyRefs: {type: array, items: {type: string, description: 策略名称, example: deny-privileged-pod}, description: 目标策略, example: [deny-privileged-pod]}
        policyGroupRefs: {type: array, items: {type: string, description: 策略组名称, example: baseline}, description: 目标策略组, example: [baseline]}
        allPolicies: {type: boolean, description: 是否匹配全部策略, example: false}
        match: {$ref: '#/components/schemas/ExceptionMatch'}
        duration: {type: string, description: 例外有效时长, example: 24h}
        retainAfterExpiry: {type: string, description: 过期后保留时长, example: 0s}
        reason: {type: string, description: 例外原因, example: Emergency maintenance}
    ExceptionRequest:
      allOf:
        - $ref: '#/components/schemas/ExceptionSpec'
        - type: object
          properties:
            name: {type: string, description: 创建时的例外名称, example: emergency-maintenance}
            resourceVersion: {type: string, description: 乐观并发版本, example: "1785920264123456789"}
            allClusters: {type: boolean, description: 是否作用于全部在线集群, example: true}
            clusterNames: {type: array, items: {type: string, description: 集群名称, example: production}, description: 指定集群, example: [production]}
    ExceptionScope:
      type: object
      required: [allClusters]
      properties:
        allClusters: {type: boolean, description: 是否作用于全部在线集群, example: true}
        clusterNames: {type: array, items: {type: string, description: 集群名称, example: production}, description: 指定集群, example: [production]}
    ExceptionListItem:
      type: object
      required: [name, phase, reason, duration, targetSummary]
      properties:
        name: {type: string, description: 例外名称, example: emergency-maintenance}
        phase: {type: string, enum: [Active, Expired], description: 当前状态, example: Active}
        reason: {type: string, description: 例外原因, example: Emergency maintenance}
        duration: {type: string, description: 有效时长, example: 24h}
        targetSummary: {type: string, description: 目标摘要, example: all policies}
        expiresAt: {type: string, format: date-time, description: 过期时间, example: "2026-08-25T10:00:00Z"}
    ExceptionStatus:
      type: object
      required: [phase, effectiveAt]
      properties:
        phase: {type: string, enum: [Active, Expired], description: 当前状态, example: Active}
        effectiveAt: {type: string, format: date-time, description: 生效时间, example: "2026-08-24T10:00:00Z"}
        expiresAt: {type: string, format: date-time, description: 过期时间, example: "2026-08-25T10:00:00Z"}
    ExceptionDetail:
      type: object
      required: [name, resourceVersion, spec, status, scope]
      properties:
        name: {type: string, description: 例外名称, example: emergency-maintenance}
        resourceVersion: {type: string, description: 乐观并发版本, example: "1785920264123456789"}
        spec: {$ref: '#/components/schemas/ExceptionSpec'}
        status: {$ref: '#/components/schemas/ExceptionStatus'}
        scope: {$ref: '#/components/schemas/ExceptionScope'}
    ExceptionListData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, description: 例外列表, items: {$ref: '#/components/schemas/ExceptionListItem'}}
    ExceptionListResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties: {data: {$ref: '#/components/schemas/ExceptionListData'}}
    ExceptionDetailResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties: {data: {$ref: '#/components/schemas/ExceptionDetail'}}
    ExceptionNameResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              description: 新建或更新后的例外名称
              required: [name]
              properties: {name: {type: string, description: 例外名称, example: emergency-maintenance}}
