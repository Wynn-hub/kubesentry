components:
  schemas:
    PolicyRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 被引用的策略名称
          example: deny-privileged-pod
        enforcementMode:
          type: string
          enum: [enforce, audit]
          description: 覆盖该策略在策略组中的执行模式
          example: enforce
    PolicyGroupPolicies:
      type: object
      properties:
        byName:
          type: array
          description: 按名称引用的策略
          items:
            $ref: '#/components/schemas/PolicyRef'
          example: [{name: deny-privileged-pod}]
        bySelector:
          type: object
          additionalProperties:
            type: string
          description: 按标签选择器引用策略
          example: {team: platform}
        exclude:
          type: array
          description: 排除的策略名称
          items:
            type: string
            description: 策略名称
            example: host-network
          example: [host-network]
    PolicyGroupScope:
      type: object
      required: [allClusters]
      properties:
        allClusters:
          type: boolean
          description: 是否作用于全部在线集群
          example: true
        clusterNames:
          type: array
          description: 指定作用集群名称
          items:
            type: string
            description: 集群名称
            example: production
          example: [production]
    PolicyGroupSpec:
      type: object
      required: [enabled, policies]
      properties:
        displayName:
          type: string
          description: 策略组显示名称
          example: Production baseline
        description:
          type: string
          description: 策略组说明
          example: Baseline policies for production workloads
        enabled:
          type: boolean
          description: 是否启用策略组
          example: true
        namespaceSelector:
          type: object
          additionalProperties: true
          description: Kubernetes 命名空间标签选择器
          example: {matchLabels: {environment: production}}
        policies:
          $ref: '#/components/schemas/PolicyGroupPolicies'
        selectorEnforcementMode:
          type: string
          enum: [enforce, audit]
          description: 标签选择器匹配策略的默认执行模式
          example: audit
    EffectiveMember:
      type: object
      required: [name, enforcementMode, source]
      properties:
        name:
          type: string
          description: 生效策略名称
          example: deny-privileged-pod
        enforcementMode:
          type: string
          enum: [enforce, audit]
          description: 生效执行模式
          example: enforce
        source:
          type: string
          description: 策略来源
          enum: [builtin, custom]
          example: builtin
    PolicyGroupStatus:
      type: object
      required: [phase, resolvedCount, resolvedPolicies]
      properties:
        phase:
          type: string
          enum: [Ready, Invalid]
          description: 策略组解析状态
          example: Ready
        resolvedCount:
          type: integer
          description: 解析出的策略数量
          example: 12
        resolvedPolicies:
          type: array
          description: 解析后的策略成员
          items:
            $ref: '#/components/schemas/EffectiveMember'
    PolicyGroupListItem:
      type: object
      required: [name, source, displayName, enabled, phase, resolvedCount]
      properties:
        name:
          type: string
          description: 策略组名称
          example: default
        source:
          type: string
          enum: [builtin, custom]
          description: 策略组来源
          example: builtin
        displayName:
          type: string
          description: 显示名称
          example: Default policies
        enabled:
          type: boolean
          description: 是否启用
          example: true
        phase:
          type: string
          enum: [Ready, Invalid]
          description: 解析状态
          example: Ready
        resolvedCount:
          type: integer
          description: 解析策略数量
          example: 37
    PolicyGroupListData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: 策略组列表
              items:
                $ref: '#/components/schemas/PolicyGroupListItem'
    PolicyGroupDetail:
      type: object
      required: [name, source, resourceVersion, spec, status, scope]
      properties:
        name:
          type: string
          description: 策略组名称
          example: baseline
        source:
          type: string
          enum: [builtin, custom]
          description: 策略组来源
          example: custom
        resourceVersion:
          type: string
          description: 乐观并发版本
          example: "1785920264123456789"
        spec:
          $ref: '#/components/schemas/PolicyGroupSpec'
        status:
          $ref: '#/components/schemas/PolicyGroupStatus'
        scope:
          $ref: '#/components/schemas/PolicyGroupScope'
    PolicyGroupRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyGroupSpec'
        - type: object
          properties:
            name:
              type: string
              description: 创建时的策略组名称，更新时忽略
              example: baseline
            resourceVersion:
              type: string
              description: 更新时使用的乐观并发版本
              example: "1785920264123456789"
            allClusters:
              type: boolean
              description: 是否作用于全部在线集群
              example: true
            clusterNames:
              type: array
              description: 指定作用集群
              items:
                type: string
                description: 集群名称
                example: production
              example: [production]
    PolicyGroupNameData:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 策略组名称
          example: baseline
    PolicyGroupEnabledData:
      type: object
      required: [enabled]
      properties:
          enabled:
            type: boolean
            description: 更新后的启用状态

    PolicyGroupEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 是否启用策略组
          example: false
    PolicyGroupListResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PolicyGroupListData'
    PolicyGroupDetailResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PolicyGroupDetail'
    PolicyGroupNameResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PolicyGroupNameData'
    PolicyGroupEnabledResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PolicyGroupEnabledData'
