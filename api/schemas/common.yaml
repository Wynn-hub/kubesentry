# 跨资源域复用的 schema。所有域的响应都通过 allOf 组合 Envelope。
components:
  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务码。0 表示成功，非 0 为 HTTP status code 乘以 100
          example: 0
        message:
          type: string
          description: 结果描述。成功时固定为 success
          example: success

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            details:
              type: array
              description: 错误明细列表。参数校验失败时逐条列出问题字段
              items:
                type: string
                description: 单条错误明细
                example: "invalid pageSize: must be one of 10, 20, 50, 100"
            data:
              $ref: '#/components/schemas/ReferencedByData'

    ReferencedByData:
      type: object
      description: 删除被引用资源时附带的引用方列表
      required: [referencedBy]
      properties:
        referencedBy:
          type: array
          description: 仍引用目标资源的对象名称
          items:
            type: string
            description: 引用方名称
            example: baseline-group
          example: [baseline-group]

    KubernetesLabelSelectorRequirement:
      type: object
      required: [key, operator]
      properties:
        key: {type: string, description: Kubernetes 标签键, example: environment}
        operator: {type: string, description: 标签选择运算符, enum: [In, NotIn, Exists, DoesNotExist], example: In}
        values: {type: array, description: In 或 NotIn 运算符使用的标签值, items: {type: string, description: 标签值, example: production}, example: [production]}

    KubernetesLabelSelector:
      type: object
      description: Kubernetes LabelSelector，按标签精确值或表达式筛选资源
      example: {matchLabels: {environment: production}}
      properties:
        matchLabels: {type: object, additionalProperties: {type: string}, description: 精确匹配的标签映射, example: {environment: production}}
        matchExpressions: {type: array, description: 表达式形式的标签选择条件, items: {$ref: '#/components/schemas/KubernetesLabelSelectorRequirement'}, example: []}

    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          description: 符合筛选条件的记录总数，不受分页限制
          example: 137
        page:
          type: integer
          description: 当前页码，从 1 开始
          example: 1
        pageSize:
          type: integer
          description: 每页记录数。仅接受 10、20、50、100
          enum: [10, 20, 50, 100]
          example: 20

    ResourceID:
      type: string
      pattern: '^[0-9]+$'
      description: Snowflake 生成的 64 位整数 ID，以字符串传输避免 JavaScript 数字精度丢失
      example: "7234567890123456789"

    MatchResource:
      type: object
      required: [apiGroups, apiVersions, resources]
      properties:
        apiGroups:
          type: array
          description: |
            匹配的 API 组。核心组用空字符串表示，星号 * 匹配全部组
            （见 internal/webhook/cache.go:190）
          items:
            type: string
            description: 单个 API 组，或 * 表示全部
            example: apps
          example: ["apps"]
        apiVersions:
          type: array
          description: 匹配的 API 版本
          items:
            type: string
            description: 单个 API 版本
            example: v1
          example: ["v1"]
        resources:
          type: array
          description: |
            匹配的资源类型，使用复数形式。星号 * 匹配全部资源
            （见 internal/webhook/cache.go:189）
          items:
            type: string
            description: 单个资源类型，或 * 表示全部
            example: deployments
          example: ["deployments"]

    PolicyMatch:
      type: object
      required: [operations, resources]
      properties:
        operations:
          type: array
          description: 匹配的准入操作类型
          items:
            type: string
            enum: [CREATE, UPDATE, DELETE, CONNECT]
            description: 单个操作类型
            example: CREATE
          example: ["CREATE", "UPDATE"]
        resources:
          type: array
          description: 匹配的资源规则列表，任一规则命中即匹配
          items:
            $ref: '#/components/schemas/MatchResource'
