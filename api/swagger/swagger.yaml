info:
  contact: {}
  description: KubeSentry Console HTTP API.
  title: KubeSentry Console API
  version: 1.0.0
paths:
  /admission-event-settings:
    get:
      description: 查询准入事件留存、重试、队列和存储策略配置。
      operationId: getAdmissionEventSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdmissionSettingsView'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 获取准入事件设置
      tags:
      - AdmissionEvent
    put:
      consumes:
      - application/json
      description: 更新准入事件留存、重试、队列和存储策略配置。
      operationId: updateAdmissionEventSettings
      parameters:
      - description: 准入事件设置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdmissionSettingsInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdmissionSettingsView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 更新准入事件设置
      tags:
      - AdmissionEvent
  /admission-events:
    get:
      description: 按集群、判决、策略、命名空间和资源条件分页检索准入事件。
      operationId: listAdmissionEvents
      parameters:
      - default: 1
        description: 页码，从 1 开始。省略时为 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页记录数。仅接受 10、20、50、100。省略时为 20
        enum:
        - 10
        - 20
        - 50
        - 100
        in: query
        name: pageSize
        type: integer
      - default: occurredAt
        description: 排序字段
        enum:
        - occurredAt
        - createdAt
        - verdict
        in: query
        name: sortBy
        type: string
      - default: desc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      - collectionFormat: csv
        description: 集群名称，逗号分隔
        in: query
        items:
          type: string
        name: cluster
        type: array
      - collectionFormat: csv
        description: 准入结论，逗号分隔多值，取 OR
        in: query
        items:
          enum:
          - audit
          - deny
          type: string
        name: verdict
        type: array
      - description: 策略名称
        in: query
        name: policy
        type: string
      - collectionFormat: csv
        description: 命名空间，逗号分隔多值
        in: query
        items:
          type: string
        name: namespace
        type: array
      - collectionFormat: csv
        description: 资源名称或 group/resource，逗号分隔
        in: query
        items:
          type: string
        name: gvk
        type: array
      - description: 资源名称
        in: query
        name: resourceName
        type: string
      - description: 请求用户
        in: query
        name: username
        type: string
      - description: 查询起始时间
        format: date-time
        in: query
        name: from
        type: string
      - description: 查询结束时间
        format: date-time
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdmissionEventPageView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 分页查询准入事件
      tags:
      - AdmissionEvent
  /admission-events/{id}:
    get:
      description: 查询准入事件及其原始 metadata/spec 快照。
      operationId: getAdmissionEvent
      parameters:
      - description: 准入事件数据库 ID
        in: path
        name: id
        pattern: ^[0-9]+$
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdmissionEventDetailView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 查询准入事件详情
      tags:
      - AdmissionEvent
  /admission-events/trend:
    get:
      description: 按时间范围返回准入事件的 audit/deny 趋势数据。
      operationId: getAdmissionEventTrend
      parameters:
      - description: 查询起始时间
        format: date-time
        in: query
        name: from
        required: true
        type: string
      - description: 查询结束时间
        format: date-time
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AdmissionTrendItemView'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 查询准入事件趋势
      tags:
      - AdmissionEvent
  /admission-link-incidents:
    get:
      description: 按集群、组件、原因和状态检索准入事件链路异常。
      operationId: listAdmissionLinkIncidents
      parameters:
      - default: 1
        description: 页码，从 1 开始。省略时为 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页记录数。仅接受 10、20、50、100。省略时为 20
        enum:
        - 10
        - 20
        - 50
        - 100
        in: query
        name: pageSize
        type: integer
      - collectionFormat: csv
        description: 按集群名称筛选，逗号分隔
        in: query
        items:
          type: string
        name: cluster
        type: array
      - collectionFormat: csv
        description: 按组件筛选，逗号分隔
        in: query
        items:
          enum:
          - webhook
          - operator
          - gateway
          type: string
        name: component
        type: array
      - collectionFormat: csv
        description: 按原因筛选，逗号分隔
        in: query
        items:
          type: string
        name: reason
        type: array
      - collectionFormat: csv
        description: 按状态筛选，逗号分隔
        in: query
        items:
          enum:
          - active
          - interrupted
          - closed
          type: string
        name: status
        type: array
      - description: 起始时间（RFC3339）
        format: date-time
        in: query
        name: from
        type: string
      - description: 结束时间（RFC3339）
        format: date-time
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.IncidentPageView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.SwagErrorResponse'
      summary: 分页查询准入链路异常
      tags:
      - LinkIncident
  /admission-link-incidents/{id}:
    get:
      description: 查询单条准入事件链路异常及其样本事件。
      operationId: getAdmissionLinkIncident
      parameters:
      - description: 准入链路异常记录 ID
        in: path
        name: id
        pattern: ^[0-9]+$
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwagOptionalResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.IncidentView'
              type: object
        "400":
          description: Bad Request
