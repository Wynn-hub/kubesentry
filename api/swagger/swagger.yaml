info:
  contact: {}
  description: KubeSentry Console HTTP API.
  title: KubeSentry Console API
  version: 1.0.0
paths:
  /admission-event-settings:
    get:
      description: 查询准入事件留存、重试、队列和存储策略配置。
      operationId: getAdmissionEventSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
