openapi: 3.1.0
info:
  title: KubeSentry Gateway Internal Contract
  version: 1.0.0
  description: |
    Internal control-plane contract for the gateway process. The member and
    console data paths use the mTLS-protected gRPC Hub service defined in
    api/proto/gateway/v1/gateway.proto. OpenAPI cannot model a gRPC stream, so
    the RPC contract remains authoritative for wire messages while this file
    indexes the HTTP health endpoints and links the RPC service explicitly.
servers:
  - url: /
    description: Gateway internal listener
tags:
  - name: Health
    description: Internal liveness and readiness probes
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check gateway liveness
      description: Returns 200 when the gateway process is alive.
      operationId: gatewayHealthz
      responses:
        '200':
          description: Gateway is alive
          content:
            text/plain:
              schema:
                type: string
                description: Probe response body
                example: ok
        '503':
          description: Gateway is not ready to serve
  /readyz:
    get:
      tags: [Health]
      summary: Check gateway readiness
      description: Returns 200 when the database and gateway dependencies are ready.
      operationId: gatewayReadyz
      responses:
        '200':
          description: Gateway is ready
          content:
            text/plain:
              schema:
                type: string
                description: Probe response body
                example: ok
        '503':
          description: Gateway is not ready
components:
  securitySchemes:
    gatewayMTLS:
      type: mutualTLS
      description: Internal callers authenticate with the gateway TLS client certificate.
    gatewaySharedToken:
      type: http
      scheme: bearer
      description: Shared token used by the console Connect stream when configured.
  x-grpc-service:
    name: kubesentry.gateway.v1.Hub
    protocol: grpc
    source: ../../api/proto/gateway/v1/gateway.proto
    methods:
      - Register
      - Sync
      - Connect
      - NotifyChange
      - Dispatch
