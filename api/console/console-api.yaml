          in: path
          required: true
          description: 异常记录 ID
          schema: {$ref: '../schemas/common.yaml#/components/schemas/ResourceID'}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/admission_link_incident.yaml#/components/schemas/AdmissionLinkIncidentDetailResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/InternalError'}

  /policies:
    get:
      tags: [Policy]
      operationId: listPolicies
      summary: 分页查询策略列表
      description: |
        按名称、来源、执行模式、编译状态筛选并分页返回策略。
        phase、mode、source 三个参数支持逗号分隔的多值，同字段内取 OR。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          description: 排序字段。省略时按 name 升序
          schema:
            type: string
            enum: [name, source, enforcementMode, phase, createdAt, updatedAt]
            default: name
            description: 排序字段
            example: name
        - name: sortOrder
          in: query
          required: false
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            description: 排序方向
            example: asc
        - name: phase
          in: query
          required: false
          description: 按编译状态筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 编译状态列表
            items:
              type: string
              enum: [Ready, Invalid]
              description: 单个编译状态
              example: Ready
        - name: mode
          in: query
          required: false
          description: 按执行模式筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 执行模式列表
            items:
              type: string
              enum: [enforce, audit]
              description: 单个执行模式
              example: enforce
        - name: source
          in: query
          required: false
          description: 按来源筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 来源列表
            items:
              type: string
              enum: [builtin, custom]
              description: 单个来源
              example: builtin
        - name: keyword
          in: query
          required: false
          description: 按名称或描述模糊匹配
          schema:
            type: string
            description: 搜索关键词
            example: privileged
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Policy]
      operationId: createPolicy
      summary: 创建策略
      description: |
        创建策略并同时写入 v1 版本快照，两者在同一事务内提交。
        Rego 在写库前同步编译校验，编译失败返回 40000 且不落库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/resource-suggestions:
    get:
      tags: [Policy]
      operationId: getResourceSuggestions
      summary: 查询资源建议
      description: |
        聚合所有策略 match 中用过的 apiGroups / apiVersions / resources 并去重排序，
        供前端可视化编辑器的下拉建议使用。不读取 rego 字段以避免传输大字段。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/ResourceSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/validate:
    post:
      tags: [Policy]
      operationId: validatePolicyRego
      summary: 校验 Rego 源码
      description: |
        只做 Rego 编译校验，不落库、不校验其他字段。
        编译通过返回 code 0 且无 data，失败返回 40000 并在 message 中给出编译器原文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/ValidateRegoRequest'
      responses:
        '200':
          description: 编译通过
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /policies/{name}:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: 查询策略详情
      description: 返回策略完整内容，含引用它的策略组列表与乐观并发令牌。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Policy]
      operationId: updatePolicy
      summary: 更新策略
      description: |
        更新策略并追加新版本快照，两者在同一事务内提交。
        labels 与现有值合并；annotations 中值为空字符串的键表示删除。
        提供 resourceVersion 时做比较并交换，不匹配返回 40900。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Policy]
      operationId: deletePolicy
      summary: 删除策略
      description: |
        默认拒绝删除被策略组引用的策略，返回 40900 并在 data.referencedBy 列出引用方。
        force=true 跳过该检查强制删除。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
        - name: force
          in: query
          required: false
          description: 为 true 时跳过引用检查强制删除
          schema:
            type: boolean
            default: false
            description: 是否强制删除
            example: false
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/{name}/versions:
    get:
      tags: [Policy]
      operationId: listPolicyVersions
      summary: 查询策略版本历史
      description: 返回版本快照列表，按版本号倒序，并标记当前生效版本。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyVersionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/{name}/rollback:
    post:
      tags: [Policy]
      operationId: rollbackPolicy
      summary: 回滚策略到上一版本
      description: |
        以追加新版本的方式回滚（roll-forward），类似 git revert，不修改历史。
        direction 为 next 恒返回 40000。已在最早版本时返回 40000。
        目标版本快照已被保留策略清理时返回 41000。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/RollbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'

  /policygroups:
    get:
