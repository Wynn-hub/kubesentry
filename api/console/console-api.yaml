        '200': {description: 更新成功, content: {application/json: {schema: {$ref: '../schemas/admission.yaml#/components/schemas/AdmissionEventSettingsResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /admission-link-incidents:
    get:
      tags: [Admission]
      operationId: listAdmissionLinkIncidents
      summary: 分页查询准入链路异常
      description: 按集群、组件、原因和状态检索准入事件链路异常。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: cluster
          in: query
          description: 按集群名称筛选，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
        - name: component
          in: query
          description: 按组件筛选，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string, enum: [webhook, operator, gateway]}}
        - name: reason
          in: query
          description: 按原因筛选，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
        - name: status
          in: query
          description: 按状态筛选，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string, enum: [active, interrupted, closed]}}
        - name: from
          in: query
          description: 起始时间（RFC3339）
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: 结束时间（RFC3339）
          schema: {type: string, format: date-time}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/admission_link_incident.yaml#/components/schemas/AdmissionLinkIncidentListResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/InternalError'}

  /admission-link-incidents/{id}:
    get:
      tags: [Admission]
      operationId: getAdmissionLinkIncident
      summary: 查询准入链路异常详情
