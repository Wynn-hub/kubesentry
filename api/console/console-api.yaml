        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
