openapi: 3.1.0
info:
  title: KubeSentry Console API
  version: 1.0.0
  description: |
    KubeSentry 控制台的 HTTP API。本文件是这些接口的唯一事实来源：
    Go 服务端接口由 ogen 从本文件生成，前端 TypeScript 类型由
    openapi-typescript 从本文件生成。

    另有两类契约不在本文件内：
    - gateway 的内部 gRPC 接口，见 api/proto/gateway/v1/gateway.proto
    - 成员集群的 CRD，见 charts/kubesentry/crds/

servers:
  - url: /api/v1
    description: 控制台 API 根路径

tags:
  - name: Policy
    description: 策略的增删改查、Rego 校验、版本与回滚
  - name: PolicyGroup
    description: 策略组的增删改查与启用状态管理
  - name: Exception
    description: 策略例外的增删改查

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        平台当前未启用认证，此声明为将来接入预留。
        任何 operation 都没有通过 security 引用它，因此所有接口当前均可匿名访问。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。省略时为 1
      schema:
        type: integer
        minimum: 1
        default: 1
        description: 页码
        example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页记录数。仅接受 10、20、50、100。省略时为 20
      schema:
        type: integer
        enum: [10, 20, 50, 100]
        default: 20
        description: 每页记录数
        example: 20
    PolicyName:
      name: name
      in: path
      required: true
      description: 策略名称
      schema:
        type: string
        description: 策略名称
        example: deny-privileged-pod
    PolicyGroupName:
      name: name
      in: path
      required: true
      description: 策略组名称
      schema:
        type: string
        description: 策略组名称
        example: baseline
    ExceptionName:
      name: name
      in: path
      required: true
      description: 例外名称
      schema:
        type: string
        description: 例外名称
        example: emergency-maintenance

  responses:
    BadRequest:
      description: 请求参数非法。code 为 40000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误。code 为 50000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在。code 为 40400
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        冲突。code 为 40900。三种情形：名称已存在、resourceVersion 过期（并发修改）、
        资源被其他对象引用（此时 data.referencedBy 列出引用方）
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    Gone:
      description: 目标版本快照已被保留策略清理。code 为 41000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

paths:
  /policies:
    get:
      tags: [Policy]
      operationId: listPolicies
      summary: 分页查询策略列表
      description: |
        按名称、来源、执行模式、编译状态筛选并分页返回策略。
        phase、mode、source 三个参数支持逗号分隔的多值，同字段内取 OR。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          description: 排序字段。省略时按 name 升序
          schema:
            type: string
            enum: [name, source, enforcementMode, phase, createdAt, updatedAt]
            default: name
            description: 排序字段
            example: name
        - name: sortOrder
          in: query
          required: false
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            description: 排序方向
            example: asc
        - name: phase
          in: query
          required: false
          description: 按编译状态筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 编译状态列表
            items:
              type: string
              enum: [Ready, Invalid]
              description: 单个编译状态
              example: Ready
        - name: mode
          in: query
          required: false
          description: 按执行模式筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 执行模式列表
            items:
              type: string
              enum: [enforce, audit]
              description: 单个执行模式
              example: enforce
        - name: source
          in: query
          required: false
          description: 按来源筛选。逗号分隔多值，取 OR
          style: form
          explode: false
          schema:
            type: array
            description: 来源列表
            items:
              type: string
              enum: [builtin, custom]
              description: 单个来源
              example: builtin
        - name: keyword
          in: query
          required: false
          description: 按名称或描述模糊匹配
          schema:
            type: string
            description: 搜索关键词
            example: privileged
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Policy]
      operationId: createPolicy
      summary: 创建策略
      description: |
        创建策略并同时写入 v1 版本快照，两者在同一事务内提交。
        Rego 在写库前同步编译校验，编译失败返回 40000 且不落库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/resource-suggestions:
    get:
      tags: [Policy]
      operationId: getResourceSuggestions
      summary: 查询资源建议
      description: |
        聚合所有策略 match 中用过的 apiGroups / apiVersions / resources 并去重排序，
        供前端可视化编辑器的下拉建议使用。不读取 rego 字段以避免传输大字段。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/ResourceSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/validate:
    post:
      tags: [Policy]
      operationId: validatePolicyRego
      summary: 校验 Rego 源码
      description: |
        只做 Rego 编译校验，不落库、不校验其他字段。
        编译通过返回 code 0 且无 data，失败返回 40000 并在 message 中给出编译器原文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/ValidateRegoRequest'
      responses:
        '200':
          description: 编译通过
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /policies/{name}:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: 查询策略详情
      description: 返回策略完整内容，含引用它的策略组列表与乐观并发令牌。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Policy]
      operationId: updatePolicy
      summary: 更新策略
      description: |
        更新策略并追加新版本快照，两者在同一事务内提交。
        labels 与现有值合并；annotations 中值为空字符串的键表示删除。
        提供 resourceVersion 时做比较并交换，不匹配返回 40900。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Policy]
      operationId: deletePolicy
      summary: 删除策略
      description: |
        默认拒绝删除被策略组引用的策略，返回 40900 并在 data.referencedBy 列出引用方。
        force=true 跳过该检查强制删除。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
        - name: force
          in: query
          required: false
          description: 为 true 时跳过引用检查强制删除
          schema:
            type: boolean
            default: false
            description: 是否强制删除
            example: false
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/{name}/versions:
    get:
      tags: [Policy]
      operationId: listPolicyVersions
      summary: 查询策略版本历史
      description: 返回版本快照列表，按版本号倒序，并标记当前生效版本。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/PolicyVersionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /policies/{name}/rollback:
    post:
      tags: [Policy]
      operationId: rollbackPolicy
      summary: 回滚策略到上一版本
      description: |
        以追加新版本的方式回滚（roll-forward），类似 git revert，不修改历史。
        direction 为 next 恒返回 40000。已在最早版本时返回 40000。
        目标版本快照已被保留策略清理时返回 41000。
      parameters:
        - $ref: '#/components/parameters/PolicyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy.yaml#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/RollbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'

  /policygroups:
    get:
      tags: [PolicyGroup]
      operationId: listPolicyGroups
      summary: 分页查询策略组列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          description: 排序字段
          schema:
            type: string
            enum: [name, displayName, enabled, phase, resolvedCount]
            default: name
        - name: sortOrder
          in: query
          required: false
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [PolicyGroup]
      operationId: createPolicyGroup
      summary: 创建策略组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /policygroups/{name}:
    get:
      tags: [PolicyGroup]
      operationId: getPolicyGroup
      summary: 查询策略组详情
      parameters:
        - $ref: '#/components/parameters/PolicyGroupName'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [PolicyGroup]
      operationId: updatePolicyGroup
      summary: 更新策略组
      parameters:
        - $ref: '#/components/parameters/PolicyGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [PolicyGroup]
      operationId: deletePolicyGroup
      summary: 删除策略组
      parameters:
        - $ref: '#/components/parameters/PolicyGroupName'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'
        '403':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /policygroups/{name}/enabled:
    put:
      tags: [PolicyGroup]
      operationId: setPolicyGroupEnabled
      summary: 设置策略组启用状态
      parameters:
        - $ref: '#/components/parameters/PolicyGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupEnabledRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../schemas/policygroup.yaml#/components/schemas/PolicyGroupEnabledResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /exceptions:
    get:
      tags: [Exception]
      operationId: listExceptions
      summary: 分页查询策略例外
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          description: 排序字段
          schema: {type: string, enum: [name, phase, targetSummary, duration, expiresAt], default: name, description: 排序字段, example: name}
        - name: sortOrder
          in: query
          description: 排序方向
          schema: {type: string, enum: [asc, desc], default: asc, description: 排序方向, example: asc}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionListResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Exception]
      operationId: createException
      summary: 创建策略例外
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionRequest'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionNameResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /exceptions/{name}:
    get:
      tags: [Exception]
      operationId: getException
      summary: 查询策略例外详情
      parameters: [{ $ref: '#/components/parameters/ExceptionName' }]
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Exception]
      operationId: updateException
      summary: 更新策略例外
      parameters: [{ $ref: '#/components/parameters/ExceptionName' }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionRequest'}}}
      responses:
        '200': {description: 更新成功, content: {application/json: {schema: {$ref: '../schemas/exception.yaml#/components/schemas/ExceptionNameResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Exception]
      operationId: deleteException
      summary: 删除策略例外
      parameters: [{ $ref: '#/components/parameters/ExceptionName' }]
      responses:
        '200': {description: 删除成功, content: {application/json: {schema: {$ref: '../schemas/policy.yaml#/components/schemas/EmptyResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
