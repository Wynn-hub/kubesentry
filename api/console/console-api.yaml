openapi: 3.1.0
info:
  title: KubeSentry Console API
  version: 1.0.0
  description: |
    KubeSentry 控制台的 HTTP API。本文件是这些接口的唯一事实来源：
    Go 服务端接口由 ogen 从本文件生成，前端 TypeScript 类型由
    openapi-typescript 从本文件生成。

    另有两类契约不在本文件内：
    - gateway 的内部 gRPC 接口，见 api/proto/gateway/v1/gateway.proto
    - 成员集群的 CRD，见 charts/kubesentry/crds/

servers:
  - url: /api/v1
    description: 控制台 API 根路径

tags:
  - name: Policy
    description: 策略的增删改查、Rego 校验、版本与回滚
  - name: PolicyGroup
    description: 策略组的增删改查与启用状态管理
  - name: Exception
    description: 策略例外的增删改查
  - name: Summary
    description: 平台资源摘要
  - name: Admission
    description: 准入事件、存储设置与链路异常
  - name: Platform
    description: 平台可观测性与运行状态
  - name: Cluster
    description: 集群管理与安装记录
  - name: Distribution
    description: 策略分发配置

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        平台当前未启用认证，此声明为将来接入预留。
        任何 operation 都没有通过 security 引用它，因此所有接口当前均可匿名访问。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。省略时为 1
      schema:
        type: integer
        minimum: 1
        default: 1
        description: 页码
        example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页记录数。仅接受 10、20、50、100。省略时为 20
      schema:
        type: integer
        enum: [10, 20, 50, 100]
        default: 20
        description: 每页记录数
        example: 20
    PolicyName:
      name: name
      in: path
      required: true
      description: 策略名称
      schema:
        type: string
        description: 策略名称
        example: deny-privileged-pod
    ClusterName:
      name: name
      in: path
      required: true
      description: 集群名称
      schema:
        type: string
        description: 集群名称
        example: production-east
    DistributionName:
      name: name
      in: path
      required: true
      description: 策略分发名称
      schema:
        type: string
        description: 策略分发名称
        example: production-baseline
    PolicyGroupName:
      name: name
      in: path
      required: true
      description: 策略组名称
      schema:
        type: string
        description: 策略组名称
        example: baseline
    ExceptionName:
      name: name
      in: path
      required: true
      description: 例外名称
      schema:
        type: string
        description: 例外名称
        example: emergency-maintenance
    AdmissionEventID:
      name: id
      in: path
      required: true
      description: 准入事件数据库 ID
      schema:
        $ref: '../schemas/common.yaml#/components/schemas/ResourceID'

  responses:
    BadRequest:
      description: 请求参数非法。code 为 40000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误。code 为 50000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在。code 为 40400
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        冲突。code 为 40900。三种情形：名称已存在、resourceVersion 过期（并发修改）、
        资源被其他对象引用（此时 data.referencedBy 列出引用方）
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    Forbidden:
      description: 操作被禁止。code 为 40300
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    Gone:
      description: 目标版本快照已被保留策略清理。code 为 41000
      content:
        application/json:
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

paths:
  /clusters:
    get:
      tags: [Cluster]
      operationId: listClusters
      summary: 分页查询集群
      description: 查询平台已登记的集群及其在线状态和节点摘要。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          description: 排序字段
          schema: {type: string, enum: [name, phase, operatorVersion, lastHeartbeatAt, createdAt], description: 集群列表排序字段, example: name}
        - name: sortOrder
          in: query
          description: 排序方向
          schema: {type: string, enum: [asc, desc], default: asc, description: 升序或降序, example: asc}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterListResponse'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Cluster]
      operationId: createCluster
      summary: 创建集群登记
      description: 创建集群登记记录并生成一次性 Helm 安装命令。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterCreateRequest'}}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterCommandResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}:
    parameters: [{ $ref: '#/components/parameters/ClusterName' }]
    get:
      tags: [Cluster]
      operationId: getCluster
      summary: 查询集群详情
      description: 查询指定集群的连接状态、版本和节点信息。
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Cluster]
      operationId: updateCluster
      summary: 更新集群标签
      description: 更新指定集群的控制台标签。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterLabelsRequest'}}}}
      responses:
        '200': {description: 更新成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterNameResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Cluster]
      operationId: deleteCluster
      summary: 删除集群登记
      description: 删除已卸载的集群登记；在线集群不能删除。
      responses:
        '200': {description: 删除成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/EmptyResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}/reissue-token:
    post:
      tags: [Cluster]
      operationId: reissueClusterToken
      summary: 重新签发集群令牌
      description: 为尚未完成注册的集群重新签发一次性安装令牌。
      parameters: [{ $ref: '#/components/parameters/ClusterName' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterTokenRequest'}}}}
      responses:
        '200': {description: 操作成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/ClusterCommandResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}/latest-install-params:
    get:
      tags: [Cluster]
      operationId: getLatestInstallParams
      summary: 查询最新安装参数
      description: 查询指定集群最近一次生成的非敏感安装参数。
      parameters: [{ $ref: '#/components/parameters/ClusterName' }]
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/InstallParamsResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}/uninstall:
    post:
      tags: [Cluster]
      operationId: createUninstallTask
      summary: 创建集群卸载任务
      description: 向在线集群下发卸载其成员组件的持久化任务。
      parameters: [{ $ref: '#/components/parameters/ClusterName' }]
      responses:
        '200': {description: 操作成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/UninstallTaskResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}/uninstall-tasks:
    get:
      tags: [Cluster]
      operationId: listUninstallTasks
      summary: 查询集群卸载任务
      description: 查询指定集群的全部卸载任务及失败原因。
      parameters: [{ $ref: '#/components/parameters/ClusterName' }]
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/UninstallTaskListResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /clusters/{name}/uninstall-tasks/{taskID}/retry:
    post:
      tags: [Cluster]
      operationId: retryUninstallTask
      summary: 重试集群卸载任务
      description: 重新投递失败的集群卸载任务。
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - name: taskID
          in: path
          required: true
          description: 卸载任务 ID
          schema: {$ref: '../schemas/common.yaml#/components/schemas/ResourceID'}
      responses:
        '200': {description: 操作成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/UninstallTaskIDResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /install-records:
    get:
      tags: [Cluster]
      operationId: listInstallRecords
      summary: 查询安装记录
      description: 分页查询平台生成的集群安装参数记录。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          description: 排序字段
          schema: {type: string, enum: [clusterName, namespace, createdAt], description: 安装记录排序字段, example: createdAt}
        - name: sortOrder
          in: query
          description: 排序方向
          schema: {type: string, enum: [asc, desc], default: desc, description: 升序或降序, example: desc}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/cluster.yaml#/components/schemas/InstallRecordListResponse'}}}}
        '500': {$ref: '#/components/responses/InternalError'}

  /distributions:
    get:
      tags: [Distribution]
      operationId: listDistributions
      summary: 分页查询策略分发
      description: 查询策略组到集群的分发配置。
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始
          schema: {type: integer, minimum: 1, default: 1, description: 当前页码, example: 1}
        - name: pageSize
          in: query
          description: 每页数量
          schema: {type: integer, enum: [10, 20, 50, 100], default: 20, description: 每页记录数, example: 20}
        - name: sortBy
          in: query
          description: 排序字段
          schema: {type: string, enum: [name], description: 策略分发列表排序字段, example: name}
        - name: sortOrder
          in: query
          description: 排序方向
          schema: {type: string, enum: [asc, desc], default: asc, description: 升序或降序, example: asc}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionListResponse'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Distribution]
      operationId: createDistribution
      summary: 创建策略分发
      description: 创建策略组到指定集群范围的分发配置。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionRequest'}}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionNameResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /distributions/{name}:
    parameters: [{ $ref: '#/components/parameters/DistributionName' }]
    get:
      tags: [Distribution]
      operationId: getDistribution
      summary: 查询策略分发详情
      description: 查询指定策略分发的集群范围和策略组配置。
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Distribution]
      operationId: updateDistribution
      summary: 更新策略分发
      description: 更新策略分发的集群范围和策略组配置。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionRequest'}}}}
      responses:
        '200': {description: 更新成功, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionNameResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Distribution]
      operationId: deleteDistribution
      summary: 删除策略分发
      description: 删除指定策略分发配置。
      responses:
        '200': {description: 删除成功, content: {application/json: {schema: {$ref: '../schemas/distribution.yaml#/components/schemas/DistributionEmptyResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /platform/overview:
    get:
      tags: [Platform]
      operationId: getPlatformOverview
      summary: 获取平台运行概览
      description: 查询控制面和成员集群的组件健康、实例和资源摘要。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: health
          in: query
          description: 按成员集群聚合健康状态筛选
          schema: {type: string, enum: [ok, degraded, unavailable], description: 成员集群聚合健康状态, example: degraded}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/PlatformOverviewResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /platform/instances/{component}/{instance}/trend:
    get:
      tags: [Platform]
      operationId: getPlatformInstanceTrend
      summary: 获取平台实例趋势
      description: 查询指定平台组件实例在时间范围内的资源趋势。
      parameters:
        - name: component
          in: path
          required: true
          description: 平台组件名称
          schema: {type: string, enum: [webhook, operator, gateway, console-api, console-web, postgres], description: 平台组件名称, example: gateway}
        - name: instance
          in: path
          required: true
          description: 平台组件实例名称
          schema: {type: string, description: 平台组件实例名称, example: gateway-0}
        - name: cluster
          in: query
          description: 成员面组件所属的集群名称；Gateway 平面组件省略
          schema: {type: string, description: 成员集群名称, example: production-east}
        - name: from
          in: query
          description: 查询起始时间，RFC3339 格式
          schema: {type: string, format: date-time, description: 查询起始时间, example: '2026-08-24T07:00:00Z'}
        - name: to
          in: query
          description: 查询结束时间，RFC3339 格式
          schema: {type: string, format: date-time, description: 查询结束时间, example: '2026-08-24T08:00:00Z'}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/PlatformTrendResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /platform/leadership-events:
    get:
      tags: [Platform]
      operationId: listPlatformLeadershipEvents
      summary: 查询平台领导权事件
      description: 分页查询平台组件 Leader 变更记录。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: component
          in: query
          description: 按发生领导权变更的组件筛选
          schema: {type: string, enum: [webhook, operator, gateway, console-api, console-web, postgres], description: 平台组件名称, example: gateway}
        - name: cluster
          in: query
          description: 按关联成员集群筛选；Gateway 平面事件省略
          schema: {type: string, description: 成员集群名称, example: production-east}
        - name: from
          in: query
          description: 查询起始时间，RFC3339 格式
          schema: {type: string, format: date-time, description: 查询起始时间, example: '2026-08-24T07:00:00Z'}
        - name: to
          in: query
          description: 查询结束时间，RFC3339 格式
          schema: {type: string, format: date-time, description: 查询结束时间, example: '2026-08-24T08:00:00Z'}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/LeadershipEventListResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /platform/settings:
    get:
      tags: [Platform]
      operationId: getPlatformSettings
      summary: 获取平台可观测性设置
      description: 查询平台组件采样和历史保存配置。
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/PlatformSettingsResponse'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Platform]
      operationId: updatePlatformSettings
      summary: 更新平台可观测性设置
      description: 更新平台组件采样和历史保存配置。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/PlatformSettingsRequest'}}}
      responses:
        '200': {description: 更新成功, content: {application/json: {schema: {$ref: '../schemas/platform.yaml#/components/schemas/PlatformSettingsResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /schema/fields:
    get:
      tags: [Summary]
      operationId: getFieldSchema
      summary: 获取 Kubernetes 资源字段树
      description: 从成员集群 OpenAPI schema 查询策略编辑器所需的资源字段树。
      parameters:
        - name: group
          in: query
          description: API 组，核心组为空
          schema: {type: string, description: API 组, example: apps}
        - name: version
          in: query
          required: true
          description: API 版本
          schema: {type: string, description: API 版本, example: v1}
        - name: resource
          in: query
          required: true
          description: 资源复数名
          schema: {type: string, description: 资源名称, example: deployments}
        - name: refresh
          in: query
          description: 是否强制刷新缓存
          schema: {type: boolean, default: false, description: 刷新缓存, example: false}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/schema.yaml#/components/schemas/FieldSchemaResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {$ref: '#/components/responses/InternalError'}

  /summary:
    get:
      tags: [Summary]
      operationId: getSummary
      summary: 获取平台资源摘要
      description: 查询策略、策略组、例外和集群的汇总数量。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: {$ref: '../schemas/summary.yaml#/components/schemas/SummaryResponse'}
        '500': {$ref: '#/components/responses/InternalError'}

  /admission-events:
    get:
      tags: [Admission]
      operationId: listAdmissionEvents
      summary: 分页查询准入事件
      description: 按集群、判决、策略、命名空间和资源条件分页检索准入事件。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          schema: {type: string, enum: [occurredAt, createdAt, verdict], default: occurredAt}
        - name: sortOrder
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
        - name: cluster
          in: query
          description: 集群名称，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
        - name: verdict
          in: query
          description: 准入结论，逗号分隔多值，取 OR
          style: form
          explode: false
          schema: {type: array, items: {type: string, enum: [audit, deny]}}
        - name: policy
          in: query
          schema: {type: string}
        - name: namespace
          in: query
          description: 命名空间，逗号分隔多值
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
        - name: gvk
          in: query
          description: 资源名称或 group/resource，逗号分隔
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
        - name: resourceName
          in: query
          schema: {type: string}
        - name: username
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200': {description: 查询成功, content: {application/json: {schema: {$ref: '../schemas/admission.yaml#/components/schemas/AdmissionEventListResponse'}}}}
