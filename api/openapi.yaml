# Unified index for the three control-plane contract families. Only Console
# browser HTTP operations are OpenAPI operations; Gateway and member-cluster
# contracts remain protobuf-first and Kubernetes-CRD-first respectively.
openapi: 3.1.0
info:
  title: KubeSentry API
  version: 1.0.0
  description: KubeSentry control-plane API contract index; see x-contract-boundaries for non-HTTP families.
paths:
  $ref: '../internal/console/openapi_bundle.json#/paths'
components:
  $ref: '../internal/console/openapi_bundle.json#/components'
x-contract-boundaries:
  console:
    kind: openapi
    source: ../internal/console/openapi_bundle.json
    sourceOfTruth: Go handler and DTO Swag annotations
    generatedSwagger: ./swagger/swagger.yaml
    routeCount: 50
  gateway:
    kind: protobuf
    source: ./proto/gateway/v1/gateway.proto
    service: kubesentry.gateway.v1.Hub
  memberClusterCRDs:
    kind: kubernetes-crd
    sources:
      - ../charts/kubesentry/crds/policy.yaml
      - ../charts/kubesentry/crds/policygroup.yaml
      - ../charts/kubesentry/crds/exception.yaml
      - ../charts/kubesentry/crds/policyversion.yaml
