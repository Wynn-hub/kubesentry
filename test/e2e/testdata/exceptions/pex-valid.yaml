apiVersion: kubesentry.io/v1alpha1
kind: PolicyException
metadata:
  name: pex-valid-hr
spec:
  policyRefs:
    # A privileged container inherently violates both policies because the K8s
    # API rejects `privileged:true` with `allowPrivilegeEscalation:false`. The
    # exemption must cover both to admit the test fixture.
    - run-as-privileged
    - privilege-escalation-allowed
  match:
    namespaces: ["pex-hr-system"]
  duration: 5m
  reason: "e2e: valid exemption"
