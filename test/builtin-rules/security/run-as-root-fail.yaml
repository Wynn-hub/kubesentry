---
# runAsRootAllowed: Container without runAsNonRoot=true (audit mode)
# satisfies: linuxHardening (capabilities.drop), privilegeEscalation=false
apiVersion: v1
kind: Pod
metadata:
  name: run-as-root-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      # runAsNonRoot NOT set — triggers audit rule
