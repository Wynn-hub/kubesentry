---
# rolebindingClusterAdminRole: RoleBinding to Role named "cluster-admin"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-admin-role-binding
  namespace: test-builtin-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
