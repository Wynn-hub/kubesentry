# tlsSettingsMissing: Ingress with TLS configured (audit mode, should PASS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safe-tls-ingress
  namespace: test-builtin-rules
spec:
  tls:
  - hosts:
    - example.com
    secretName: tls-secret
  rules:
  - host: example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 443
