# rolebindingClusterAdminRole: RoleBinding not to Role named cluster-admin (should PASS)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-safe-role-binding
  namespace: test-builtin-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: view-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
