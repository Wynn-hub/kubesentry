# dangerousCapabilities: Pod with no dangerous capabilities (should PASS)
apiVersion: v1
kind: Pod
metadata:
  name: safe-no-dangerous-caps-pod
  namespace: test-builtin-rules
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: nginx:1.25.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
