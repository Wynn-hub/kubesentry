---
# rolebindingRolePodExecAttach: RoleBinding to Role named "pod-exec-role"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-role-exec-binding
  namespace: test-builtin-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-exec-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
