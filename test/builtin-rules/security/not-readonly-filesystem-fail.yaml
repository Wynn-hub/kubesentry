---
# notReadOnlyRootFilesystem: Container with readOnlyRootFilesystem=false (audit mode)
# satisfies: linuxHardening (capabilities.drop), privilegeEscalation=false
apiVersion: v1
kind: Pod
metadata:
  name: not-readonly-fs-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false    # triggers audit rule
      capabilities:
        drop: ["ALL"]
