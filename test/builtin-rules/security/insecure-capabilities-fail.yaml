---
# insecureCapabilities: Container adding insecure capability NET_BIND_SERVICE (audit mode)
# satisfies: linuxHardening (capabilities.drop), privilegeEscalation=false
apiVersion: v1
kind: Pod
metadata:
  name: insecure-caps-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_BIND_SERVICE"]       # insecure capability — triggers audit rule
        drop: ["ALL"]
