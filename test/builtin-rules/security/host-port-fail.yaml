---
# hostPortSet: Container with hostPort (audit mode)
# satisfies: linuxHardening, privilegeEscalation=false
apiVersion: v1
kind: Pod
metadata:
  name: host-port-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    ports:
    - containerPort: 8080
      hostPort: 8080                  # triggers audit rule
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
