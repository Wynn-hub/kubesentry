---
# rolebindingClusterRolePodExecAttach: RoleBinding to ClusterRole named "pod-exec-clusterrole"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-clusterrole-exec-binding
  namespace: test-builtin-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-exec-clusterrole
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
