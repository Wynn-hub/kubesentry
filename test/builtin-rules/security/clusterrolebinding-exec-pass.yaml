kind: ClusterRoleBinding
metadata:
  name: test-safe-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
