# sensitiveContainerEnvVar: Pod with only safe env vars (should PASS)
apiVersion: v1
kind: Pod
metadata:
  name: safe-env-pod
  namespace: test-builtin-rules
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: nginx:1.25.0
    env:
    - name: APP_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
