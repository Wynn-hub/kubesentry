---
# clusterrolebindingPodExecAttach: ClusterRoleBinding to role named "pod-exec-clusterrole"
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-exec-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-exec-clusterrole
subjects:
- kind: ServiceAccount
  name: default
  namespace: test-builtin-rules
