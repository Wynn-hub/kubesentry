---
# automountServiceAccountToken: Pod without automountServiceAccountToken=false (audit mode)
# satisfies: linuxHardening, privilegeEscalation=false
apiVersion: v1
kind: Pod
metadata:
  name: automount-token-pod
  namespace: test-builtin-rules
spec:
  # automountServiceAccountToken NOT set to false — triggers audit rule
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
