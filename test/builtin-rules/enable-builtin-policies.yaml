---
# PolicyGroup to enable all 37 built-in rules for testing
apiVersion: kubesentry.io/v1alpha1
kind: PolicyGroup
metadata:
  name: builtin-rules-test
  namespace: kubesentry-system
spec:
  displayName: "Built-in Rules Test"
  description: "Test suite for all 37 built-in policies"
  enabled: true
  # Enable all built-in policies
  policies:
  # ==================== Security Rules ====================
  - key: runAsPrivileged
    enabled: true
    mode: enforce
  - key: privilegeEscalationAllowed
    enabled: true
    mode: enforce
  - key: runAsRootAllowed
    enabled: true
    mode: audit
  - key: notReadOnlyRootFilesystem
    enabled: true
    mode: audit
  - key: linuxHardening
    enabled: true
    mode: enforce
  - key: insecureCapabilities
    enabled: true
    mode: audit
  - key: dangerousCapabilities
    enabled: true
    mode: enforce
  - key: hostPIDSet
    enabled: true
    mode: enforce
  - key: hostIPCSet
    enabled: true
    mode: enforce
  - key: hostNetworkSet
    enabled: true
    mode: audit
  - key: hostPortSet
    enabled: true
    mode: audit
  - key: sensitiveContainerEnvVar
    enabled: true
    mode: enforce
  - key: automountServiceAccountToken
    enabled: true
    mode: audit
  - key: sensitiveConfigmapContent
    enabled: true
    mode: enforce
  - key: tlsSettingsMissing
    enabled: true
    mode: audit
  - key: clusterrolePodExecAttach
    enabled: true
    mode: enforce
  - key: rolePodExecAttach
    enabled: true
    mode: enforce
  - key: clusterrolebindingPodExecAttach
    enabled: true
    mode: enforce
  - key: rolebindingRolePodExecAttach
    enabled: true
    mode: enforce
  - key: rolebindingClusterRolePodExecAttach
    enabled: true
    mode: enforce
  - key: clusterrolebindingClusterAdmin
    enabled: true
    mode: enforce
  - key: rolebindingClusterAdminClusterRole
    enabled: true
    mode: enforce
  - key: rolebindingClusterAdminRole
    enabled: true
    mode: enforce
  # ==================== Efficiency Rules ====================
  - key: cpuRequestsMissing
    enabled: true
    mode: audit
  - key: memoryRequestsMissing
    enabled: true
    mode: audit
  - key: cpuLimitsMissing
    enabled: true
    mode: audit
  - key: memoryLimitsMissing
    enabled: true
    mode: audit
  # ==================== Reliability Rules ====================
  - key: readinessProbeMissing
    enabled: true
    mode: audit
  - key: livenessProbeMissing
    enabled: true
    mode: audit
  - key: tagNotSpecified
    enabled: true
    mode: enforce
  - key: pullPolicyNotAlways
    enabled: true
    mode: audit
  - key: priorityClassNotSet
    enabled: true
    mode: audit
  - key: deploymentMissingReplicas
    enabled: true
    mode: audit
  - key: metadataAndInstanceMismatched
    enabled: true
    mode: audit
  - key: topologySpreadConstraint
    enabled: true
    mode: audit
  - key: hpaMaxAvailability
    enabled: true
    mode: audit
  - key: hpaMinAvailability
    enabled: true
    mode: audit
