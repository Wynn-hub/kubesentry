# priorityClassNotSet: Deployment with priorityClassName set (audit mode, should PASS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-priority-class
  namespace: test-builtin-rules
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      containers:
      - name: app
        image: nginx:1.25.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
