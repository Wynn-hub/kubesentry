---
# topologySpreadConstraint: Deployment without topology spread constraint (audit mode)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-topology-spread
  namespace: test-builtin-rules
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      # topologySpreadConstraints NOT set — triggers audit rule
      containers:
      - name: app
        image: nginx:1.19
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
