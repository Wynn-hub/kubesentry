# readinessProbeMissing: Deployment with readiness probe (audit mode, should PASS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-readiness-probe
  namespace: test-builtin-rules
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app
        image: nginx:1.25.0
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
