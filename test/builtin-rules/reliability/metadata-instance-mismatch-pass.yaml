# metadataAndInstanceMismatched: Deployment where instance label matches name (audit mode, should PASS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: test-builtin-rules
  labels:
    app.kubernetes.io/instance: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app
        image: nginx:1.25.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
