# tagNotSpecified: Pod with explicit non-latest image tag (should PASS)
apiVersion: v1
kind: Pod
metadata:
  name: safe-explicit-tag-pod
  namespace: test-builtin-rules
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: nginx:1.25.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
