---
# hpaMinAvailability: HPA with minReplicas <= 1
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: low-min-hpa
  namespace: test-builtin-rules
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
