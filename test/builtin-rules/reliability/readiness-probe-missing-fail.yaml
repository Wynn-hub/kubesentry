---
# readinessProbeMissing: Deployment without readiness probe (audit mode)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-readiness-probe
  namespace: test-builtin-rules
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app
        image: nginx:1.19
        # missing readiness probe — triggers audit rule
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
