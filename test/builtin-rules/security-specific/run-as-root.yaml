apiVersion: v1
kind: Pod
metadata:
  name: root-test
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
