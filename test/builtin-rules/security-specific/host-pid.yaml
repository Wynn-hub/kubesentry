apiVersion: v1
kind: Pod
metadata:
  name: host-pid-test
  namespace: test-builtin-rules
spec:
  hostPID: true
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
