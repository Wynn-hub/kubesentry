apiVersion: v1
kind: Pod
metadata:
  name: sensitive-env-test
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    env:
    - name: DATABASE_PASSWORD
      value: "secret123"
    - name: API_KEY
      value: "sk_test_12345"
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
