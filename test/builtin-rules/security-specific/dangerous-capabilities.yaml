apiVersion: v1
kind: Pod
metadata:
  name: dangerous-caps-test
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        add: ["SYS_ADMIN"]
        drop: ["NET_RAW"]
