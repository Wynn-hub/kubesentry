apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: linux-hardening
  namespace: kubesentry-system
  labels:
    kubesentry.io/builtin: "true"
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    
    _has_seccomp(c) {
      c.securityContext.seccompProfile.type
    }
    _has_selinux(c) {
      c.securityContext.seLinuxOptions.type
    }
    _has_drop_caps(c) {
      c.securityContext.capabilities.drop[_]
    }
    
    deny[msg] {
      c := _containers[_]
      not _has_seccomp(c)
      not _has_selinux(c)
      not _has_drop_caps(c)
      msg := sprintf("container %q has no Linux hardening (set seccompProfile, seLinuxOptions, or capabilities.drop)", [c.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["serviceaccounts"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
    - apiGroups: ["networking.k8s.io"]
      apiVersions: ["v1"]
      resources: ["ingresses"]
    - apiGroups: ["autoscaling"]
      apiVersions: ["v2"]
      resources: ["horizontalpodautoscalers"]
