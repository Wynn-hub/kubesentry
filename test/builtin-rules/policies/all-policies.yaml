---
# 安全规则
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: privilege-escalation-allowed
  namespace: kubesentry-system
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    deny[msg] {
      c := _containers[_]
      c.securityContext.allowPrivilegeEscalation == true
      msg := sprintf("container %q must not allow privilege escalation", [c.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: host-pid-set
  namespace: kubesentry-system
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    deny[msg] {
      input.request.object.spec.hostPID == true
      msg := "hostPID is not allowed"
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: tag-not-specified
  namespace: kubesentry-system
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    deny[msg] {
      c := _containers[_]
      image := c.image
      not contains(image, ":")
      msg := sprintf("container %q image must specify a tag", [c.name])
    }
    deny[msg] {
      c := _containers[_]
      image := c.image
      endswith(image, ":latest")
      msg := sprintf("container %q image tag cannot be latest", [c.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: cpu-requests-missing
  namespace: kubesentry-system
spec:
  enforcementMode: audit
  rego: |
    package kubesentry
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    deny[msg] {
      c := _containers[_]
      not c.resources.requests.cpu
      msg := sprintf("container %q must set cpu requests", [c.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: deployment-single-replica
  namespace: kubesentry-system
spec:
  enforcementMode: audit
  rego: |
    package kubesentry
    deny[msg] {
      input.request.resource.resource == "deployments"
      replicas := input.request.object.spec.replicas
      replicas == 1
      msg := "Deployment should have more than one replica"
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments"]
