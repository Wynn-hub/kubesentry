apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: insecure-capabilities
  namespace: kubesentry-system
  labels:
    kubesentry.io/builtin: "true"
spec:
  enforcementMode: audit
  rego: |
    package kubesentry
    
    _insecure := {
      "NET_BIND_SERVICE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID",
      "KILL", "SETGID", "SETUID", "SETPCAP", "SETFCAP",
      "NET_BROADCAST", "IPC_LOCK", "IPC_OWNER",
      "SYS_BOOT", "SYS_NICE", "SYS_TIME", "SYS_TTY_CONFIG",
      "MKNOD", "AUDIT_WRITE", "AUDIT_CONTROL", "SYSLOG", "LINUX_IMMUTABLE",
    }
    
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    
    deny[msg] {
      c := _containers[_]
      cap := c.securityContext.capabilities.add[_]
      _insecure[cap]
      msg := sprintf("container %q adds insecure capability %q", [c.name, cap])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["serviceaccounts"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
    - apiGroups: ["networking.k8s.io"]
      apiVersions: ["v1"]
      resources: ["ingresses"]
    - apiGroups: ["autoscaling"]
      apiVersions: ["v2"]
      resources: ["horizontalpodautoscalers"]
