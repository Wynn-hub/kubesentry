---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: run-as-privileged
  namespace: kubesentry-system
  labels:
    kubesentry.io/builtin: "true"
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    _init_containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.initContainers[_]
    }
    _init_containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.initContainers[_]
    }
    
    deny[msg] {
      c := _containers[_]
      c.securityContext.privileged == true
      msg := sprintf("container %q must not run as privileged", [c.name])
    }
    deny[msg] {
      c := _init_containers[_]
      c.securityContext.privileged == true
      msg := sprintf("initContainer %q must not run as privileged", [c.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["serviceaccounts"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
    - apiGroups: ["networking.k8s.io"]
      apiVersions: ["v1"]
      resources: ["ingresses"]
    - apiGroups: ["autoscaling"]
      apiVersions: ["v2"]
      resources: ["horizontalpodautoscalers"]
---
