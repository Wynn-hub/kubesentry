apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: sensitive-env-var
  namespace: kubesentry-system
  labels:
    kubesentry.io/builtin: "true"
spec:
  enforcementMode: enforce
  rego: |
    package kubesentry
    
    _sensitive_patterns := {
      "password", "passwd", "secret", "token", "key",
      "api_key", "apikey", "auth", "credential", "credentials",
      "private_key", "access_key", "private_token",
    }
    
    _containers[c] {
      input.request.resource.resource == "pods"
      c := input.request.object.spec.containers[_]
    }
    _containers[c] {
      input.request.resource.resource != "pods"
      c := input.request.object.spec.template.spec.containers[_]
    }
    
    deny[msg] {
      c := _containers[_]
      env := c.env[_]
      name_lower := lower(env.name)
      pattern := _sensitive_patterns[_]
      contains(name_lower, pattern)
      msg := sprintf("container %q has potentially sensitive env var %q", [c.name, env.name])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["serviceaccounts"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
    - apiGroups: ["networking.k8s.io"]
      apiVersions: ["v1"]
      resources: ["ingresses"]
    - apiGroups: ["autoscaling"]
      apiVersions: ["v2"]
      resources: ["horizontalpodautoscalers"]
---
apiVersion: kubesentry.io/v1alpha1
kind: Policy
metadata:
  name: automount-token
  namespace: kubesentry-system
  labels:
    kubesentry.io/builtin: "true"
spec:
  enforcementMode: audit
  rego: |
    package kubesentry
    
    # Pods
    deny[msg] {
      input.request.resource.resource == "pods"
      not input.request.object.spec.automountServiceAccountToken == false
      msg := "Pod should set spec.automountServiceAccountToken=false"
    }
    
    # ServiceAccounts
    deny[msg] {
      input.request.resource.resource == "serviceaccounts"
      not input.request.object.automountServiceAccountToken == false
      msg := sprintf("ServiceAccount %q should set automountServiceAccountToken=false", [input.request.object.metadata.name])
    }
    
    # Workloads (deployments, statefulsets, daemonsets)
    deny[msg] {
      r := input.request.resource.resource
      r != "pods"
      r != "serviceaccounts"
      not input.request.object.spec.template.spec.automountServiceAccountToken == false
      msg := sprintf("%s should set spec.template.spec.automountServiceAccountToken=false", [r])
    }
  match:
    operations: ["CREATE", "UPDATE"]
    resources:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
