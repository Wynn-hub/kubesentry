# cpuRequestsMissing: Pod without CPU requests or limits (audit mode)
# No limits.cpu either — prevents K8s from defaulting requests.cpu = limits.cpu
apiVersion: v1
kind: Pod
metadata:
  name: no-cpu-request-pod
  namespace: test-builtin-rules
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: nginx:1.25.0
    resources:
      requests:
        memory: "128Mi"
      limits:
        memory: "256Mi"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
