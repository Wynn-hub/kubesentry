---
# cpuRequestsMissing: Pod without CPU requests (audit mode)
apiVersion: v1
kind: Pod
metadata:
  name: no-cpu-request-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    resources:
      limits:
        cpu: "1"
        memory: "128Mi"
      # missing cpu requests — triggers audit rule
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
