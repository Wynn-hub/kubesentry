---
# memoryLimitsMissing: Pod without memory limits (audit mode)
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-limits-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
      # missing memory limits — triggers audit rule
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
