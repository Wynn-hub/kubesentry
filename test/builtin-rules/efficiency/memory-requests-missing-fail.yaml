# memoryRequestsMissing: Pod without memory requests or limits (audit mode)
# No limits.memory either — prevents K8s from defaulting requests.memory = limits.memory
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-request-pod
  namespace: test-builtin-rules
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: nginx:1.25.0
    resources:
      requests:
        cpu: "100m"
      limits:
        cpu: "500m"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
