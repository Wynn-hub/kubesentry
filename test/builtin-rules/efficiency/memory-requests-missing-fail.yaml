---
# memoryRequestsMissing: Pod without memory requests (audit mode)
apiVersion: v1
kind: Pod
metadata:
  name: no-memory-request-pod
  namespace: test-builtin-rules
spec:
  containers:
  - name: app
    image: nginx:1.19
    resources:
      requests:
        cpu: "100m"
      limits:
        cpu: "500m"
        memory: "256Mi"
      # missing memory requests — triggers audit rule
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
